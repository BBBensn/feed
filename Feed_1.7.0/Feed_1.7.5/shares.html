<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed · Share-Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/bensn.css">
<style>
:root {
  --c-diary:     #e5b181;
  --c-mood:      #b8ebd0;
  --c-fits:      #C9B6BE;
  --c-reflexion: #ffb400;
  --c-symptome:  #f96f5d;
  --c-therapie:  #9c3848;
  --c-projekt:   #1d4e89;
  --c-idea:      #6622cc;
  --c-arbeit:    #065143;
  --c-schicht:   #3BC14A;
  --c-ui:        #00a6ed;
}

body { overscroll-behavior: none; }

.app-wrap {
  position: relative; z-index: 1;
  max-width: 760px; margin: 0 auto;
  padding: 0 1.25rem 4rem;
  min-height: 100vh; display: flex; flex-direction: column;
}

/* ── Section headers ── */
.section-title {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin: 1.75rem 0 .75rem;
}

/* ── Form Card ── */
.form-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 1.5rem;
  margin-bottom: 1.5rem;
}
.form-row { margin-bottom: 1.1rem; }
.form-row:last-child { margin-bottom: 0; }
.form-label {
  font-family: 'DM Mono', monospace; font-size: 9px;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); display: block; margin-bottom: 5px;
}
.form-input {
  width: 100%; background: rgba(255,255,255,.03);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 12px; color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 12px;
  outline: none; transition: border-color .15s;
  box-sizing: border-box;
}
.form-input:focus { border-color: var(--border-hover); }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: 1.1rem; }

/* ── Type Toggle Buttons ── */
.type-toggles { display: flex; flex-wrap: wrap; gap: .35rem; }
.type-toggle {
  font-family: 'DM Mono', monospace; font-size: 10px;
  letter-spacing: .07em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 4px;
  border: 1px solid var(--border); color: var(--muted);
  background: none; cursor: pointer; transition: all .15s;
  user-select: none;
}
.type-toggle:hover { border-color: var(--border-hover); color: var(--text); }
.type-toggle.active[data-type="diary"]      { border-color:var(--c-diary);     color:var(--c-diary);     background:rgba(229,177,129,.08); }
.type-toggle.active[data-type="mood"]       { border-color:var(--c-mood);      color:var(--c-mood);      background:rgba(184,235,208,.08); }
.type-toggle.active[data-type="reflexion"]  { border-color:var(--c-reflexion); color:var(--c-reflexion); background:rgba(255,180,0,.08); }
.type-toggle.active[data-type="symptome"]   { border-color:var(--c-symptome);  color:var(--c-symptome);  background:rgba(249,111,93,.08); }
.type-toggle.active[data-type="therapie"]   { border-color:var(--c-therapie);  color:var(--c-therapie);  background:rgba(156,56,72,.12); }
.type-toggle.active[data-type="fits"]       { border-color:var(--c-fits);      color:var(--c-fits);      background:rgba(201,182,190,.08); }
.type-toggle.active[data-type="arbeit"]     { border-color:#065143;            color:#065143;            background:rgba(6,81,67,.12); }
.type-toggle.active[data-type="idea"]       { border-color:#6622cc;            color:#6622cc;            background:rgba(102,34,204,.10); }
.type-toggle.active[data-type="project_log"]{ border-color:#1d4e89;            color:#1d4e89;            background:rgba(29,78,137,.12); }
.type-toggle.active[data-type="schichten"]  { border-color:var(--c-schicht);   color:var(--c-schicht);   background:rgba(59,193,74,.08); }
.type-toggle.blocked[data-type="diary"]     { border-color:var(--c-diary);     color:var(--c-diary);     background:rgba(229,177,129,.08); opacity:.6; text-decoration: line-through; }

/* ── Autocomplete ── */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: #1a1a1c; border: 1px solid var(--border-hover);
  border-radius: 8px; max-height: 180px; overflow-y: auto;
  z-index: 100; display: none;
}
.autocomplete-list.open { display: block; }
.autocomplete-item {
  font-family: 'DM Mono', monospace; font-size: 11px;
  padding: 8px 12px; cursor: pointer; color: var(--text);
  transition: background .1s;
}
.autocomplete-item:hover { background: rgba(255,255,255,.05); }

/* ── Tag Pills ── */
.tag-list { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem; min-height: 0; }
.tag-pill {
  font-family: 'DM Mono', monospace; font-size: 10px;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 8px;
  display: flex; align-items: center; gap: 5px; color: var(--text);
}
.tag-pill-remove {
  cursor: pointer; color: var(--muted); font-size: 11px;
  background: none; border: none; padding: 0; line-height: 1;
  transition: color .15s;
}
.tag-pill-remove:hover { color: var(--accent-red); }

/* ── Toggle Switch ── */
.toggle-row { display: flex; align-items: center; gap: .75rem; }
.toggle-switch {
  position: relative; width: 36px; height: 20px;
  flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; cursor: pointer;
  background: rgba(255,255,255,.1); border-radius: 20px;
  transition: background .15s;
}
.toggle-slider::before {
  content: ''; position: absolute;
  width: 14px; height: 14px; left: 3px; top: 3px;
  background: var(--muted); border-radius: 50%;
  transition: transform .15s, background .15s;
}
.toggle-switch input:checked + .toggle-slider { background: var(--c-schicht); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); background: #fff; }
.toggle-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

/* ── Buttons ── */
.btn-primary {
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .06em;
  background: var(--green); color: #0a0a0b; border: none;
  border-radius: 8px; padding: 9px 18px; cursor: pointer;
  font-weight: 500; transition: opacity .15s;
}
.btn-primary:hover { opacity: .85; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-secondary {
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .06em;
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 8px; padding: 9px 16px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.btn-secondary:hover { border-color: var(--border-hover); color: var(--text); }
.btn-danger {
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .06em;
  background: none; border: 1px solid rgba(255,0,81,.3); color: var(--accent-red);
  border-radius: 8px; padding: 9px 14px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.btn-danger:hover { background: rgba(255,0,81,.06); border-color: var(--accent-red); }
.btn-row { display: flex; gap: .5rem; align-items: center; margin-top: 1.25rem; flex-wrap: wrap; }
.form-msg { font-family: 'DM Mono', monospace; font-size: 11px; margin-left: auto; }

/* ── Share List ── */
.share-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.1rem 1.25rem;
  display: grid; grid-template-columns: 1fr auto;
  gap: .5rem; align-items: start; margin-bottom: .6rem;
  transition: border-color .15s;
}
.share-row:hover { border-color: var(--border-hover); }
.share-row.inactive { opacity: .45; }
.share-label { font-family: 'Syne', sans-serif; font-size: .95rem; font-weight: 700; letter-spacing: -.01em; margin-bottom: .25rem; }
.share-meta { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); line-height: 1.8; }
.share-meta span { color: var(--text); }
.share-url {
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--c-ui);
  cursor: pointer; display: inline-block; margin-top: .3rem;
  border: none; background: none; padding: 0; letter-spacing: .02em;
  text-align: left;
}
.share-url:hover { opacity: .7; }
.share-actions { display: flex; gap: .4rem; align-items: center; }
.share-icon-btn {
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .05em;
  background: none; border: 1px solid var(--border); color: var(--muted);
  border-radius: 6px; padding: 4px 9px; cursor: pointer;
  transition: border-color .15s, color .15s; white-space: nowrap;
}
.share-icon-btn:hover { border-color: var(--border-hover); color: var(--text); }
.share-icon-btn.danger { border-color: rgba(255,0,81,.2); color: rgba(255,0,81,.6); }
.share-icon-btn.danger:hover { border-color: var(--accent-red); color: var(--accent-red); }

.state-msg { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); text-align: center; padding: 2rem 1rem; border: 1px dashed var(--border); border-radius: 12px; }

/* ── Copied Toast ── */
#copy-toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: var(--green); color: #0a0a0b;
  font-family: 'DM Mono', monospace; font-size: 11px;
  padding: 8px 16px; border-radius: 6px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200;
}
#copy-toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="blobs" id="blobs"></div>

<div class="app-wrap">
  <nav class="app-nav">
    <a href="https://bensn.me" class="nav-crumb"><span>bensn</span>.me</a>
    <span class="nav-sep">/</span>
    <a href="/feed" class="nav-crumb" style="text-decoration:none">feed</a>
    <span class="nav-sep">/</span>
    <span class="nav-current">shares</span>
    <div class="nav-right">
      <div class="dot" id="statusDot" style="background:var(--muted);animation:none"></div>
      <span id="statusText">laden…</span>
    </div>
  </nav>

  <!-- ── New Share Form ── -->
  <div class="section-title">Neuen Link erstellen</div>
  <div class="form-card">

    <div class="form-row">
      <label class="form-label">Für wen?</label>
      <input class="form-input" id="f-label" type="text" placeholder="z.B. Therapeut, Anna, …" autocomplete="off">
    </div>

    <div class="form-row">
      <label class="form-label">Zugelassene Kategorien <span style="color:var(--muted);font-size:9px;margin-left:.3rem">(nichts = alle)</span></label>
      <div class="type-toggles" id="allowed-types">
        <button class="type-toggle" data-type="diary">Diary</button>
        <button class="type-toggle" data-type="mood">Mood</button>
        <button class="type-toggle" data-type="reflexion">Reflection</button>
        <button class="type-toggle" data-type="symptome">Symptoms</button>
        <button class="type-toggle" data-type="therapie">Therapy</button>
        <button class="type-toggle" data-type="fits">Fits</button>
        <button class="type-toggle" data-type="arbeit">Work</button>
        <button class="type-toggle" data-type="idea">Ideas</button>
        <button class="type-toggle" data-type="project_log">Projects</button>
        <button class="type-toggle" data-type="schichten">Schichten</button>
      </div>
    </div>

    <div class="form-row-2">
      <div>
        <label class="form-label">Zeitraum von</label>
        <input class="form-input" id="f-date-from" type="date">
      </div>
      <div>
        <label class="form-label">Zeitraum bis</label>
        <input class="form-input" id="f-date-to" type="date">
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">Blockierte Links <span style="color:var(--muted);font-size:9px;margin-left:.3rem">(Notes mit diesen Links werden ausgeblendet)</span></label>
      <div class="autocomplete-wrap">
        <input class="form-input" id="f-wikilink-input" type="text" placeholder="Link eingeben…" autocomplete="off">
        <div class="autocomplete-list" id="wikilink-dropdown"></div>
      </div>
      <div class="tag-list" id="f-wikilinks"></div>
    </div>

    <div class="form-row">
      <div class="toggle-row">
        <label class="toggle-switch">
          <input type="checkbox" id="f-include-work" checked>
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label">Schicht-Events einschließen</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="create-btn" onclick="createShare()">Link erstellen</button>
      <span class="form-msg" id="create-msg"></span>
    </div>
  </div>

  <!-- ── Existing Shares ── -->
  <div class="section-title">Aktive Links</div>
  <div id="shares-list"><div class="state-msg">Laden…</div></div>

  <footer style="border-top:1px solid var(--border);padding:1.5rem 0 0;display:flex;justify-content:space-between;margin-top:auto">
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">feed.bensn.me/shares</span>
  </footer>
</div>

<div id="copy-toast">Link kopiert ✓</div>

<script src="/shared/bensn.js"></script>
<script>
/* ── Auth header (same as index.html — credentials in sessionStorage) ── */
const _auth = sessionStorage.getItem('bensn_auth');
const AUTH_HEADER = _auth ? {'Authorization': _auth} : {};

/* ── Wikilink state ── */
let blockedWikilinks = [];
let allWikilinks = [];

/* ── Type toggle state ── */
let allowedTypes = new Set();

document.querySelectorAll('#allowed-types .type-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.type;
    if (allowedTypes.has(t)) { allowedTypes.delete(t); btn.classList.remove('active'); }
    else { allowedTypes.add(t); btn.classList.add('active'); }
  });
});

/* ── Wikilink autocomplete ── */
async function loadWikilinks() {
  try {
    const r = await fetch('/api/wikilinks', {headers: AUTH_HEADER});
    if (r.ok) allWikilinks = await r.json();
  } catch(e) {}
}

const wlInput = document.getElementById('f-wikilink-input');
const wlDropdown = document.getElementById('wikilink-dropdown');

wlInput.addEventListener('input', () => {
  const q = wlInput.value.trim().toLowerCase();
  if (!q) { wlDropdown.classList.remove('open'); return; }
  const matches = allWikilinks.filter(l =>
    l.toLowerCase().includes(q) && !blockedWikilinks.includes(l)
  ).slice(0, 10);
  if (!matches.length) { wlDropdown.classList.remove('open'); return; }
  wlDropdown.innerHTML = matches.map(l =>
    `<div class="autocomplete-item" data-val="${escHtml(l)}">${escHtml(l)}</div>`
  ).join('');
  wlDropdown.classList.add('open');
});

wlDropdown.addEventListener('click', e => {
  const item = e.target.closest('.autocomplete-item');
  if (!item) return;
  addWikilink(item.dataset.val);
});

wlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = wlInput.value.trim();
    if (v) addWikilink(v);
  }
  if (e.key === 'Escape') wlDropdown.classList.remove('open');
});

document.addEventListener('click', e => {
  if (!e.target.closest('.autocomplete-wrap')) wlDropdown.classList.remove('open');
});

function addWikilink(link) {
  if (!link || blockedWikilinks.includes(link)) return;
  blockedWikilinks.push(link);
  wlInput.value = '';
  wlDropdown.classList.remove('open');
  renderWikilinkTags('f-wikilinks', blockedWikilinks, removeWikilink);
}

function removeWikilink(link) {
  blockedWikilinks = blockedWikilinks.filter(l => l !== link);
  renderWikilinkTags('f-wikilinks', blockedWikilinks, removeWikilink);
}

function renderWikilinkTags(containerId, links, removeFn) {
  const container = document.getElementById(containerId);
  container.innerHTML = links.map(l =>
    `<span class="tag-pill">${escHtml(l)}<button class="tag-pill-remove" data-link="${escHtml(l)}">✕</button></span>`
  ).join('');
  container.querySelectorAll('.tag-pill-remove').forEach(btn => {
    btn.addEventListener('click', () => removeFn(btn.dataset.link));
  });
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Create Share ── */
async function createShare() {
  const label = document.getElementById('f-label').value.trim();
  if (!label) {
    showMsg('create-msg', 'Name fehlt.', 'var(--accent-red)');
    return;
  }
  const btn = document.getElementById('create-btn');
  btn.disabled = true;

  // Map type toggle values to actual DB type values
  const typeMap = {
    diary: 'diary', mood: 'mood', reflexion: 'reflexion',
    symptome: 'symptome', therapie: 'therapie', fits: 'fits',
    arbeit: 'arbeit', idea: 'idea', project_log: 'project_log',
    schichten: null  // handled via include_work
  };

  let allowed = [];
  let includeWork = document.getElementById('f-include-work').checked;
  allowedTypes.forEach(t => {
    if (t === 'schichten') { includeWork = true; return; }
    const mapped = typeMap[t];
    if (mapped) allowed.push(mapped);
  });

  const payload = {
    label,
    allowed_types: allowed.length ? allowed : null,
    blocked_wikilinks: blockedWikilinks.length ? blockedWikilinks : null,
    date_from: document.getElementById('f-date-from').value || null,
    date_to: document.getElementById('f-date-to').value || null,
    include_work: includeWork,
  };

  try {
    const r = await fetch('/api/shares', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', ...AUTH_HEADER},
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    showMsg('create-msg', '✓ Link erstellt', 'var(--green)');
    // Reset form
    document.getElementById('f-label').value = '';
    document.getElementById('f-date-from').value = '';
    document.getElementById('f-date-to').value = '';
    blockedWikilinks = [];
    allowedTypes = new Set();
    document.querySelectorAll('#allowed-types .type-toggle').forEach(b => b.classList.remove('active'));
    renderWikilinkTags('f-wikilinks', [], () => {});
    setTimeout(() => showMsg('create-msg', '', ''), 2000);
    loadShares();
  } catch(e) {
    showMsg('create-msg', 'Fehler: ' + e.message, 'var(--accent-red)');
  } finally {
    btn.disabled = false;
  }
}

/* ── Load & render shares ── */
async function loadShares() {
  const dot = document.getElementById('statusDot');
  const st = document.getElementById('statusText');
  try {
    const r = await fetch('/api/shares', {headers: AUTH_HEADER});
    if (!r.ok) throw new Error(r.status);
    const shares = await r.json();
    dot.style.background = 'var(--green)';
    dot.style.animation = 'pulse 2s ease-in-out infinite';
    st.textContent = shares.filter(s => s.active).length + ' aktiv';
    renderShares(shares);
  } catch(e) {
    dot.style.background = 'var(--accent-red)';
    dot.style.animation = 'none';
    st.textContent = 'fehler';
    document.getElementById('shares-list').innerHTML =
      '<div class="state-msg">Fehler: ' + e.message + '</div>';
  }
}

const EDIT_ALL_TYPES = [
  {t:'diary',l:'Diary'},{t:'mood',l:'Mood'},{t:'reflexion',l:'Reflection'},
  {t:'symptome',l:'Symptoms'},{t:'therapie',l:'Therapy'},{t:'fits',l:'Fits'},
  {t:'arbeit',l:'Work'},{t:'idea',l:'Ideas'},{t:'project_log',l:'Projects'}
];

function renderShares(shares) {
  const list = document.getElementById('shares-list');
  if (!shares.length) {
    list.innerHTML = '<div class="state-msg">Noch keine Links erstellt.</div>';
    return;
  }
  list.innerHTML = '';
  shares.forEach(s => {
    const url = window.location.origin + '/s/' + s.token;
    const row = document.createElement('div');
    row.className = 'share-row' + (s.active ? '' : ' inactive');
    row.dataset.shareId = s.id;

    let meta = [];
    if (s.date_from || s.date_to) {
      const from = s.date_from ? s.date_from.slice(0,10) : '—';
      const to = s.date_to ? s.date_to.slice(0,10) : 'offen';
      meta.push('📅 ' + from + ' → ' + to);
    } else {
      meta.push('Gesamter Zeitraum');
    }
    if (s.allowed_types && s.allowed_types.length) {
      meta.push('Typen: <span>' + s.allowed_types.join(', ') + '</span>');
    }
    if (s.blocked_wikilinks && s.blocked_wikilinks.length) {
      meta.push('Geblockt: <span>' + s.blocked_wikilinks.map(escHtml).join(', ') + '</span>');
    }
    if (!s.include_work) meta.push('Keine Schichten');

    const eid = 'edit-' + s.id;
    row.innerHTML = `
      <div>
        <div class="share-label">${escHtml(s.label)}</div>
        <div class="share-meta">${meta.join(' · ')}</div>
        <button class="share-url" onclick="copyLink('${escHtml(url)}')">${url}</button>
      </div>
      <div class="share-actions">
        <button class="share-icon-btn" onclick="copyLink('${escHtml(url)}')">Kopieren</button>
        <button class="share-icon-btn" onclick="toggleEditRow('${s.id}')">Bearbeiten</button>
        ${s.active
          ? `<button class="share-icon-btn" onclick="toggleActiveShare('${s.id}',true,this)">Deaktivieren</button>`
          : `<button class="share-icon-btn" onclick="toggleActiveShare('${s.id}',false,this)">Aktivieren</button>`
        }
        <button class="share-icon-btn danger" onclick="deleteShare('${s.id}',this)">Löschen</button>
      </div>
      <div id="${eid}" style="display:none;grid-column:1/-1;border-top:1px solid var(--border);padding-top:1rem;margin-top:.5rem">
        <div class="form-row-2" style="margin-bottom:.75rem">
          <div>
            <label class="form-label">Name</label>
            <input class="form-input" id="${eid}-label" type="text" value="${escHtml(s.label)}">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
            <div>
              <label class="form-label">Von</label>
              <input class="form-input" id="${eid}-from" type="date" value="${s.date_from ? s.date_from.slice(0,10) : ''}">
            </div>
            <div>
              <label class="form-label">Bis (leer = offen)</label>
              <input class="form-input" id="${eid}-to" type="date" value="${s.date_to ? s.date_to.slice(0,10) : ''}">
            </div>
          </div>
        </div>
        <div class="form-row" style="margin-bottom:.75rem">
          <label class="form-label">Zugelassene Kategorien <span style="color:var(--muted);font-size:9px;margin-left:.3rem">(nichts = alle)</span></label>
          <div class="type-toggles" id="${eid}-types" style="margin-top:.25rem"></div>
        </div>
        <div class="form-row" style="margin-bottom:.75rem">
          <label class="form-label">Blockierte Links</label>
          <div class="autocomplete-wrap">
            <input class="form-input" id="${eid}-wl-input" type="text" placeholder="Link hinzufügen…" autocomplete="off">
            <div class="autocomplete-list" id="${eid}-wl-dropdown"></div>
          </div>
          <div class="tag-list" id="${eid}-wl-tags"></div>
        </div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <button class="btn-primary" onclick="saveEdit('${s.id}')">Speichern</button>
          <button class="btn-secondary" onclick="toggleEditRow('${s.id}')">Abbrechen</button>
          <span class="form-msg" id="${eid}-msg"></span>
        </div>
      </div>`;

    row._editWikilinks = s.blocked_wikilinks ? [...s.blocked_wikilinks] : [];
    list.appendChild(row);
    initEditForm(s.id, row._editWikilinks, s.allowed_types || []);
  });
}

function toggleEditRow(id) {
  const el = document.getElementById('edit-' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function initEditForm(shareId, wikilinkState, existingTypes) {
  const eid = 'edit-' + shareId;
  // Type toggles
  const typesEl = document.getElementById(eid + '-types');
  if (typesEl) {
    typesEl.innerHTML = EDIT_ALL_TYPES.map(({t,l}) =>
      `<button class="type-toggle${existingTypes.includes(t)?' active':''}" data-type="${t}">${l}</button>`
    ).join('');
    typesEl.querySelectorAll('.type-toggle').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('active'));
    });
  }
  // Wikilink tags
  renderEditTags(shareId, wikilinkState);
  // Wikilink autocomplete
  const input = document.getElementById(eid + '-wl-input');
  const dropdown = document.getElementById(eid + '-wl-dropdown');
  if (!input) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { dropdown.classList.remove('open'); return; }
    const matches = allWikilinks.filter(l => l.toLowerCase().includes(q) && !wikilinkState.includes(l)).slice(0,10);
    if (!matches.length) { dropdown.classList.remove('open'); return; }
    dropdown.innerHTML = matches.map(l => `<div class="autocomplete-item" data-val="${escHtml(l)}">${escHtml(l)}</div>`).join('');
    dropdown.classList.add('open');
  });
  dropdown.addEventListener('click', e => {
    const item = e.target.closest('.autocomplete-item');
    if (!item) return;
    if (!wikilinkState.includes(item.dataset.val)) {
      wikilinkState.push(item.dataset.val);
      renderEditTags(shareId, wikilinkState);
    }
    input.value = ''; dropdown.classList.remove('open');
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = input.value.trim();
      if (v && !wikilinkState.includes(v)) { wikilinkState.push(v); renderEditTags(shareId, wikilinkState); }
      input.value = ''; dropdown.classList.remove('open');
    }
    if (e.key === 'Escape') dropdown.classList.remove('open');
  });
}

function renderEditTags(shareId, stateArr) {
  const container = document.getElementById('edit-' + shareId + '-wl-tags');
  if (!container) return;
  container.innerHTML = stateArr.map(l =>
    `<span class="tag-pill">${escHtml(l)}<button class="tag-pill-remove" data-link="${escHtml(l)}">✕</button></span>`
  ).join('');
  container.querySelectorAll('.tag-pill-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = stateArr.indexOf(btn.dataset.link);
      if (idx > -1) { stateArr.splice(idx, 1); renderEditTags(shareId, stateArr); }
    });
  });
}

async function saveEdit(shareId) {
  const eid = 'edit-' + shareId;
  const label = document.getElementById(eid + '-label').value.trim();
  const dateFrom = document.getElementById(eid + '-from').value || null;
  const dateTo = document.getElementById(eid + '-to').value || null;
  const msg = document.getElementById(eid + '-msg');
  const row = document.querySelector('[data-share-id="' + shareId + '"]');
  const wikilinks = row ? row._editWikilinks : [];
  const typeBtns = document.querySelectorAll('#' + eid + '-types .type-toggle.active');
  const allowedTypes = typeBtns.length ? Array.from(typeBtns).map(b => b.dataset.type) : null;
  if (!label) { msg.style.color='var(--accent-red)'; msg.textContent='Name fehlt.'; return; }
  const payload = {
    label, date_from: dateFrom, date_to: dateTo,
    blocked_wikilinks: wikilinks.length ? wikilinks : null,
    allowed_types: allowedTypes
  };
  try {
    const r = await fetch('/api/shares/' + shareId, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json', ...AUTH_HEADER},
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error(r.status);
    msg.style.color = 'var(--green)'; msg.textContent = '✓ Gespeichert';
    setTimeout(() => loadShares(), 700);
  } catch(e) {
    msg.style.color = 'var(--accent-red)'; msg.textContent = 'Fehler: ' + e.message;
  }
}

/* ── Actions ── */
async function deleteShare(id, btn) {
  if (!confirm('Link permanent löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/shares/' + id, {method: 'DELETE', headers: AUTH_HEADER});
    if (!r.ok) throw new Error(r.status);
    loadShares();
  } catch(e) {
    alert('Fehler: ' + e.message);
    btn.disabled = false;
  }
}

async function toggleActiveShare(id, currentlyActive, btn) {
  btn.disabled = true;
  try {
    const r = await fetch('/api/shares/' + id, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json', ...AUTH_HEADER},
      body: JSON.stringify({active: !currentlyActive})
    });
    if (!r.ok) throw new Error(r.status);
    loadShares();
  } catch(e) {
    alert('Fehler: ' + e.message);
    btn.disabled = false;
  }
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => {
    const toast = document.getElementById('copy-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  });
}

function showMsg(id, text, color) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.style.color = color || 'var(--muted)';
}

/* ── Init ── */
loadWikilinks();
loadShares();
</script>
</body>
</html>

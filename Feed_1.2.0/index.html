<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed · bensn.me</title>
<meta name="description" content="Persönlicher Journal-Feed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/bensn.css">
<style>
:root {
  --c-diary:     #e5b181;
  --c-mood:      #b8ebd0;
  --c-fits:      #ff0051;
  --c-reflexion: #ffb400;
  --c-symptome:  #f96f5d;
  --c-therapie:  #9c3848;
  --c-projekt:   #1d4e89;
  --c-idea:      #6622cc;
  --c-arbeit:    #065143;
  --c-ui:        #00a6ed;
}

body { overscroll-behavior: none; }

.app-wrap {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.25rem 4rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Filter Bar ── */
.filter-bar {
  display: flex;
  gap: .35rem;
  flex-wrap: nowrap;
  padding: .75rem 0 1rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }

.filter-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.filter-btn:hover { border-color: var(--border-hover); color: var(--text); }

/* Active states per type */
.filter-btn[data-type="diary"].active   { border-color:var(--c-diary);    color:var(--c-diary);    background:rgba(229,177,129,.08); }
.filter-btn[data-type="mood"].active    { border-color:var(--c-mood);     color:var(--c-mood);     background:rgba(184,235,208,.08); }
.filter-btn[data-type="fits"].active    { border-color:var(--c-fits);     color:var(--c-fits);     background:rgba(255,0,81,.08); }
.filter-btn[data-type="reflexion"].active  { border-color:var(--c-reflexion);color:var(--c-reflexion);background:rgba(255,180,0,.08); }
.filter-btn[data-type="symptome"].active   { border-color:var(--c-symptome); color:var(--c-symptome); background:rgba(249,111,93,.08); }
.filter-btn[data-type="therapie"].active   { border-color:var(--c-therapie); color:var(--c-therapie); background:rgba(156,56,72,.12); }
.filter-btn[data-type="projekt"].active    { border-color:var(--c-projekt);  color:var(--c-projekt);  background:rgba(29,78,137,.12); }
.filter-btn[data-type="idea"].active       { border-color:var(--c-idea);     color:var(--c-idea);     background:rgba(102,34,204,.10); }
.filter-btn[data-type="arbeit"].active     { border-color:var(--c-arbeit);   color:var(--c-arbeit);   background:rgba(6,81,67,.12); }

/* ── Day Separator ── */
.day-sep {
  display: flex;
  align-items: center;
  gap: .75rem;
  margin: 1.5rem 0 .5rem;
}
.day-sep:first-child { margin-top: 0; }
.day-sep-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.day-sep-line { flex: 1; height: 1px; background: var(--border); }

/* ── Feed ── */
#feed { display: flex; flex-direction: column; gap: .65rem; }

/* ── Note Card ── */
.note-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem 1.25rem 1.25rem 1.6rem;
  transition: border-color .2s;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeUp .35s ease forwards;
  position: relative;
  overflow: hidden;
}
.note-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.note-card:hover { border-color: var(--border-hover); }

.note-card.type-diary::before        { background: var(--c-diary); }
.note-card.type-mood::before         { background: var(--c-mood); }
.note-card.type-fits::before         { background: var(--c-fits); }
.note-card.type-reflexion::before,
.note-card.type-reflexionen::before  { background: var(--c-reflexion); }
.note-card.type-symptome::before,
.note-card.type-symptom::before      { background: var(--c-symptome); }
.note-card.type-therapie::before     { background: var(--c-therapie); }
.note-card.type-project_log::before,
.note-card.type-projectlog::before   { background: var(--c-projekt); }
.note-card.type-idea::before,
.note-card.type-ideas::before        { background: var(--c-idea); }
.note-card.type-arbeit::before       { background: var(--c-arbeit); }

.note-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: .6rem;
}
.note-type-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid currentColor;
  opacity: .85;
}
.badge-diary       { color: var(--c-diary); }
.badge-mood        { color: var(--c-mood); }
.badge-fits        { color: var(--c-fits); }
.badge-reflexion,
.badge-reflexionen { color: var(--c-reflexion); }
.badge-symptome,
.badge-symptom     { color: var(--c-symptome); }
.badge-therapie    { color: var(--c-therapie); }
.badge-project_log,
.badge-projectlog  { color: var(--c-projekt); }
.badge-idea,
.badge-ideas       { color: var(--c-idea); }
.badge-arbeit      { color: var(--c-arbeit); }

.note-date {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
}
.note-title {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -.01em;
  margin-bottom: .5rem;
  color: var(--text);
}

/* ── Markdown body ── */
.note-body {
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.8;
  word-break: break-word;
}
.note-body h1, .note-body h2, .note-body h3 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  color: var(--text);
  margin: .75rem 0 .3rem;
  letter-spacing: -.01em;
}
.note-body h1 { font-size: .95rem; }
.note-body h2 { font-size: .88rem; }
.note-body h3 { font-size: .82rem; color: var(--muted); }
.note-body strong { color: var(--text); font-weight: 500; }
.note-body em { font-style: italic; opacity: .85; }
.note-body hr { border: none; border-top: 1px solid var(--border); margin: .75rem 0; }
.note-body p { margin-bottom: .4rem; }
.note-body p:last-child { margin-bottom: 0; }
.note-body ul, .note-body ol { margin: .4rem 0 .5rem 1.2rem; }
.note-body li { margin-bottom: .2rem; }
.note-body code {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--c-ui);
}

/* ── Timeline ── */
.md-timeline {
  margin: .75rem 0;
  position: relative;
  padding-left: 0;
}
.md-timeline-track {
  position: absolute;
  left: 90px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: var(--border);
}
.md-timeline-item {
  display: grid;
  grid-template-columns: 80px 20px 1fr;
  gap: 0 10px;
  margin-bottom: 1rem;
  align-items: start;
}
.md-timeline-date {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-align: right;
  padding-top: 2px;
  line-height: 1.4;
}
.md-timeline-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--green);
  margin-top: 3px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.md-timeline-content {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .6rem .85rem;
}
.md-timeline-title {
  font-family: 'Syne', sans-serif;
  font-size: .88rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: .2rem;
}
.md-timeline-body {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.65;
}

.note-body-full { display: none; }
.note-card.expanded .note-body-preview { display: none; }
.note-card.expanded .note-body-full { display: block; }

.note-expand {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--c-ui);
  cursor: pointer;
  margin-top: .5rem;
  display: inline-block;
  background: none;
  border: none;
  padding: 0;
  letter-spacing: .04em;
}
.note-expand:hover { opacity: .7; }

.note-image {
  width: 100%;
  max-height: 480px;
  object-fit: cover;
  border-radius: 8px;
  margin-top: .75rem;
  background: rgba(255,255,255,.03);
}

.state-msg {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 3rem 1rem;
  border: 1px dashed var(--border);
  border-radius: 16px;
  line-height: 1.8;
}

.load-more {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 20px;
  cursor: pointer;
  margin: 1.5rem auto 0;
  display: block;
  transition: border-color .15s, color .15s;
}
.load-more:hover { border-color: var(--c-ui); color: var(--c-ui); }

footer {
  border-top: 1px solid var(--border);
  padding: 2rem 0 0;
  display: flex;
  justify-content: space-between;
  margin-top: auto;
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="blobs" id="blobs"></div>

<div class="app-wrap">

  <nav class="app-nav">
    <a href="https://bensn.me" class="nav-crumb"><span>bensn</span>.me</a>
    <span class="nav-sep">/</span>
    <span class="nav-current">feed</span>
    <div class="nav-right">
      <div class="dot" id="statusDot" style="background:var(--muted);animation:none"></div>
      <span id="statusText">laden…</span>
    </div>
  </nav>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn" data-type="diary">Diary</button>
    <button class="filter-btn" data-type="mood">Mood</button>
    <button class="filter-btn" data-type="fits">Fits</button>
    <button class="filter-btn" data-type="reflexion">Reflection</button>
    <button class="filter-btn" data-type="symptome">Symptoms</button>
    <button class="filter-btn" data-type="therapie">Therapy</button>
    <button class="filter-btn" data-type="projekt">Projects</button>
    <button class="filter-btn" data-type="idea">Ideas</button>
    <button class="filter-btn" data-type="arbeit">Work</button>
  </div>

  <div id="feed"></div>

  <footer>
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">feed.bensn.me</span>
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)" id="footer-clock"></span>
  </footer>
</div>

<script src="/shared/bensn.js"></script>
<script>
/* ── Clock ── */
function pad(n){return String(n).padStart(2,'0')}
function clockTick(){
  const n=new Date(),el=document.getElementById('footer-clock');
  if(el) el.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
clockTick(); setInterval(clockTick,1000);

/* ── State ── */
let allNotes=[], activeTypes=new Set(), page=0;
const PAGE_SIZE=20;

/* ── Timeline Parser ── */
function parseTimeline(content){
  // Parse options line [line-N, body-N]
  const lines=content.split('\n').filter(l=>l.trim()!='');
  // Skip option line if present
  let start=0;
  if(lines[0]&&lines[0].trim().startsWith('[')) start=1;

  const items=[];
  let current=null;
  for(let i=start;i<lines.length;i++){
    const l=lines[i];
    if(l.trim().startsWith('+')){
      const val=l.trim().slice(1).trim();
      if(!current){ current={date:val,title:'',body:[]}; }
      else if(!current.title){ current.title=val; }
      else { current.body.push(val); }
    } else if(l.trim()===''){
      if(current){ items.push(current); current=null; }
    }
  }
  if(current) items.push(current);
  return items;
}

function renderTimeline(content){
  const items=parseTimeline(content);
  if(!items.length) return `<pre style="font-size:10px;color:var(--muted)">${escHtml(content)}</pre>`;

  let html=`<div class="md-timeline"><div class="md-timeline-track"></div>`;
  items.forEach(item=>{
    html+=`<div class="md-timeline-item">
      <div class="md-timeline-date">${escHtml(item.date)}</div>
      <div style="display:flex;flex-direction:column;align-items:center;padding-top:3px">
        <div class="md-timeline-dot"></div>
      </div>
      <div class="md-timeline-content">
        ${item.title?`<div class="md-timeline-title">${escHtml(item.title)}</div>`:''}
        ${item.body.length?`<div class="md-timeline-body">${item.body.map(escHtml).join('<br>')}</div>`:''}
      </div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}

/* ── Markdown Parser ── */
function renderMarkdown(raw){
  if(!raw) return '';
  let lines=raw.split('\n');

  // Strip leading template date headers: "# 11. April 2026" or "# 2026-04-..."
  while(lines.length && /^#\s+(\d{1,2}\.\s+\w+\s+\d{4}|\d{4}-\d{2}-)/.test(lines[0].trim())){
    lines.shift();
  }
  // Strip leading ---
  if(lines.length && lines[0].trim()==='---') lines.shift();
  // Strip leading blank lines
  while(lines.length && lines[0].trim()==='') lines.shift();

  const html=[];
  let i=0;
  while(i<lines.length){
    const line=lines[i];
    const t=line.trim();

    // Fenced code block
    if(t.startsWith('```')){
      const lang=t.slice(3).trim().toLowerCase();
      const blockLines=[];
      i++;
      while(i<lines.length && !lines[i].trim().startsWith('```')){
        blockLines.push(lines[i]);
        i++;
      }
      i++; // closing ```
      if(lang==='timeline'){
        html.push(renderTimeline(blockLines.join('\n')));
      } else {
        html.push(`<pre style="font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:.75rem;overflow-x:auto;margin:.5rem 0">${escHtml(blockLines.join('\n'))}</pre>`);
      }
      continue;
    }

    if(!t){ html.push('<br>'); i++; continue; }

    // Headings
    if(/^### /.test(t)){ html.push('<h3>'+inlineFmt(t.slice(4))+'</h3>'); i++; continue; }
    if(/^## /.test(t)){ html.push('<h2>'+inlineFmt(t.slice(3))+'</h2>'); i++; continue; }
    if(/^# /.test(t)){ html.push('<h1>'+inlineFmt(t.slice(2))+'</h1>'); i++; continue; }

    // HR
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ html.push('<hr>'); i++; continue; }

    // Unordered list
    if(/^[-*] /.test(t)){
      html.push('<ul>');
      while(i<lines.length && /^[-*] /.test(lines[i].trim())){
        html.push('<li>'+inlineFmt(lines[i].trim().slice(2))+'</li>');
        i++;
      }
      html.push('</ul>');
      continue;
    }

    // Ordered list
    if(/^\d+\. /.test(t)){
      html.push('<ol>');
      while(i<lines.length && /^\d+\. /.test(lines[i].trim())){
        html.push('<li>'+inlineFmt(lines[i].trim().replace(/^\d+\. /,''))+'</li>');
        i++;
      }
      html.push('</ol>');
      continue;
    }

    // Paragraph
    html.push('<p>'+inlineFmt(t)+'</p>');
    i++;
  }

  return html.join('').replace(/(<br>){3,}/g,'<br><br>');
}

function inlineFmt(s){
  return s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g,(m,p1,p2)=>escHtml(p2||p1))
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}

/* ── Clean title ── */
const TYPE_WORDS=['diary','mood','fits','reflexion','reflexionen','symptome','symptom',
  'therapie','arbeit','projectlog','project_log','idea','ideas'];

function cleanTitle(title){
  if(!title) return '';
  let t=title.trim();
  TYPE_WORDS.forEach(w=>{
    t=t.replace(new RegExp('^'+w+'[\\s_-]*','i'),'');
  });
  t=t.replace(/^\d{4}-\d{2}-\d{2}(-\d{4})?[-_]?/,'');
  return t.trim();
}

/* ── Helpers ── */
function fmtTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Vienna'});
}
function fmtDayLabel(iso){
  if(!iso) return '—';
  const d=new Date(iso), now=new Date();
  const diff=Math.floor((now-d)/86400000);
  if(diff===0) return 'Heute';
  if(diff===1) return 'Gestern';
  return d.toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'long',timeZone:'Europe/Vienna'});
}
function dayKey(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('en-CA',{timeZone:'Europe/Vienna'});
}
function typeLabel(type){
  const map={diary:'Diary',mood:'Mood',fits:'Fits',reflexion:'Reflection',reflexionen:'Reflection',
    symptome:'Symptoms',symptom:'Symptoms',therapie:'Therapy',arbeit:'Work',
    project_log:'Project',projectlog:'Project',idea:'Idea',ideas:'Idea'};
  return map[(type||'').toLowerCase()]||type||'Note';
}
function badgeClass(type){ return 'badge-'+(type||'').toLowerCase().replace(/\s/g,'_'); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function toggleExpand(id,btn){
  const card=document.getElementById(id);
  card.classList.toggle('expanded');
  btn.textContent=card.classList.contains('expanded')?'less ▴':'more ▾';
}

/* ── Render note ── */
function renderNote(note, idx){
  const type=(note.type||'').toLowerCase();
  const id='note-'+idx;
  const raw=note.content||'';

  let bodyHtml='';
  if(note.images&&note.images.length>0){
    bodyHtml=note.images.map(img=>`<img class="note-image" src="${escAttr(img.url)}" alt="${escAttr(img.alt||'')}" loading="lazy" onerror="this.style.display='none'">`).join('');
    if(raw.trim()) bodyHtml+=`<div class="note-body" style="margin-top:.75rem">${renderMarkdown(raw)}</div>`;
  } else if(raw.length>400){
    const shortRaw=raw.slice(0,400).trimEnd()+'…';
    bodyHtml=`
      <div class="note-body note-body-preview">${renderMarkdown(shortRaw)}</div>
      <div class="note-body note-body-full">${renderMarkdown(raw)}</div>
      <button class="note-expand" onclick="toggleExpand('${id}',this)">more ▾</button>`;
  } else {
    bodyHtml=`<div class="note-body">${renderMarkdown(raw)}</div>`;
  }

  const ct=cleanTitle(note.title);
  const titleHtml=ct&&ct.length>1?`<div class="note-title">${escHtml(ct)}</div>`:'';

  const el=document.createElement('div');
  el.id=id;
  el.className=`note-card type-${type}`;
  el.style.animationDelay=(idx%PAGE_SIZE*35)+'ms';
  el.innerHTML=`
    <div class="note-meta">
      <span class="note-type-badge ${badgeClass(type)}">${typeLabel(type)}</span>
      <span class="note-date">${fmtTime(note.date)}</span>
    </div>
    ${titleHtml}${bodyHtml}`;
  return el;
}

/* ── Render feed ── */
function renderFeed(notes, append=false){
  const feed=document.getElementById('feed');
  document.querySelector('.load-more')?.remove();
  if(!append){ feed.innerHTML=''; page=0; }
  if(!notes.length&&!append){ feed.innerHTML='<div class="state-msg">Keine Einträge gefunden.</div>'; return; }

  const start=page*PAGE_SIZE;
  const slice=notes.slice(start, start+PAGE_SIZE);
  let lastDay=append?(feed.dataset.lastDay||''):'';

  slice.forEach((note,i)=>{
    const day=dayKey(note.date);
    if(day!==lastDay){
      const sep=document.createElement('div');
      sep.className='day-sep';
      sep.innerHTML=`<span class="day-sep-label">${fmtDayLabel(note.date)}</span><div class="day-sep-line"></div>`;
      feed.appendChild(sep);
      lastDay=day;
    }
    feed.appendChild(renderNote(note, start+i));
  });
  feed.dataset.lastDay=lastDay;

  if(notes.length>start+PAGE_SIZE){
    const btn=document.createElement('button');
    btn.className='load-more';
    btn.textContent='Load more';
    btn.onclick=()=>{page++;renderFeed(notes,true);};
    feed.after(btn);
  }
}

/* ── Filter (toggle, multi-select) ── */
function typeMatches(noteType, filterType){
  const t=(noteType||'').toLowerCase();
  if(filterType==='reflexion') return t==='reflexion'||t==='reflexionen';
  if(filterType==='symptome')  return t==='symptome'||t==='symptom';
  if(filterType==='projekt')   return t==='project_log'||t==='projectlog';
  if(filterType==='idea')      return t==='idea'||t==='ideas';
  return t===filterType;
}

function applyFilter(){
  const filtered=activeTypes.size===0
    ?allNotes
    :allNotes.filter(n=>Array.from(activeTypes).some(ft=>typeMatches(n.type,ft)));
  page=0;
  renderFeed(filtered);
}

document.getElementById('filterBar').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn) return;
  const type=btn.dataset.type;
  if(activeTypes.has(type)){
    activeTypes.delete(type);
    btn.classList.remove('active');
  } else {
    activeTypes.add(type);
    btn.classList.add('active');
  }
  applyFilter();
});

/* ── Load ── */
async function loadFeed(){
  const dot=document.getElementById('statusDot'), st=document.getElementById('statusText');
  try{
    const r=await fetch('/api/feed?limit=500');
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    allNotes=data.notes||[];
    dot.style.background='var(--green)'; dot.style.animation='pulse 2s ease-in-out infinite';
    st.textContent=allNotes.length+' entries';
    renderFeed(allNotes);
  }catch(e){
    dot.style.background='var(--accent-red)'; dot.style.animation='none'; st.textContent='error';
    document.getElementById('feed').innerHTML=`<div class="state-msg">Verbindungsfehler<br><span style="font-size:11px;color:var(--accent-red)">${e.message}</span></div>`;
  }
}

loadFeed();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feed · bensn.me</title>
<meta name="description" content="Persönlicher Journal-Feed.">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="feed">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" />
<link rel="stylesheet" href="/shared/bensn.css">
<style>
:root {
  --c-diary:     #e5b181;
  --c-mood:      #b8ebd0;
  --c-fits:      #C9B6BE;
  --c-reflexion: #ffb400;
  --c-symptome:  #f96f5d;
  --c-therapie:  #9c3848;
  --c-projekt:   #1d4e89;
  --c-idea:      #6622cc;
  --c-arbeit:    #065143;
  --c-schicht:   #3BC14A;
  --c-health:    #22d3d3;
  --c-ui:        #00a6ed;
}

body { overscroll-behavior: none; }

.app-wrap {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.25rem 4rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Toolbar ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 0;
  padding: .65rem 0 .75rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
  min-height: 44px;
}

/* Fixed left: sync button */
.tb-sync {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
  margin-right: .4rem;
}
.tb-sync:hover { border-color: var(--c-ui); color: var(--c-ui); }
.tb-sync.spinning .material-symbols-outlined { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tb-sync .material-symbols-outlined { font-size: 16px; }

/* Fixed right: search toggle */
.tb-search-toggle {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
  margin-left: .4rem;
}
.tb-search-toggle:hover { border-color: var(--c-ui); color: var(--c-ui); }
.tb-search-toggle.tb-active { border-color: var(--c-ui); color: var(--c-ui); background: rgba(0,166,237,.08); }
.tb-search-toggle .material-symbols-outlined { font-size: 17px; }

/* Filter toggle button */
.tb-filter-toggle {
  flex-shrink: 0;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  margin-right: .4rem;
}
.tb-filter-toggle:hover { border-color: var(--border-hover); color: var(--text); }
.tb-filter-toggle.tb-active { border-color: var(--c-ui); color: var(--c-ui); background: rgba(0,166,237,.08); }

/* Middle area: filters or search */
.tb-middle {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

/* Filters wrap: scrollable row of filter buttons */
#filtersWrap {
  display: flex;
  gap: .35rem;
  overflow-x: auto;
  scrollbar-width: none;
  transition: opacity .2s;
}
#filtersWrap::-webkit-scrollbar { display: none; }
#filtersWrap.tb-hidden { display: none; }

/* Search wrap */
#searchWrap {
  display: flex;
  align-items: center;
}
#searchWrap.tb-hidden { display: none; }

#searchInput {
  width: 100%;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color .15s;
}
#searchInput:focus { border-color: var(--c-ui); }
#searchInput::placeholder { color: var(--muted); }

/* Search highlight */
mark {
  background: rgba(255,180,0,.3);
  color: var(--text);
  border-radius: 2px;
  padding: 0 1px;
}

/* Filter buttons (inside filtersWrap) */
.filter-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.filter-btn:hover { border-color: var(--border-hover); color: var(--text); }

/* Active states per type */
.filter-btn[data-type="diary"].active   { border-color:var(--c-diary);    color:var(--c-diary);    background:rgba(229,177,129,.08); }
.filter-btn[data-type="mood"].active    { border-color:var(--c-mood);     color:var(--c-mood);     background:rgba(184,235,208,.08); }
.filter-btn[data-type="fits"].active    { border-color:var(--c-fits);     color:var(--c-fits);     background:rgba(255,0,81,.08); }
.filter-btn[data-type="reflexion"].active  { border-color:var(--c-reflexion);color:var(--c-reflexion);background:rgba(255,180,0,.08); }
.filter-btn[data-type="symptome"].active   { border-color:var(--c-symptome); color:var(--c-symptome); background:rgba(249,111,93,.08); }
.filter-btn[data-type="therapie"].active   { border-color:var(--c-therapie); color:var(--c-therapie); background:rgba(156,56,72,.12); }
.filter-btn[data-type="projekt"].active    { border-color:var(--c-projekt);  color:var(--c-projekt);  background:rgba(29,78,137,.12); }
.filter-btn[data-type="idea"].active       { border-color:var(--c-idea);     color:var(--c-idea);     background:rgba(102,34,204,.10); }
.filter-btn[data-type="arbeit"].active     { border-color:var(--c-arbeit);   color:var(--c-arbeit);   background:rgba(6,81,67,.12); }

/* ── Day Separator ── */
.day-sep {
  display: flex;
  align-items: center;
  gap: .75rem;
  margin: 1.5rem 0 .5rem;
}
.day-sep:first-child { margin-top: 0; }
.day-sep-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.day-sep-line { flex: 1; height: 1px; background: var(--border); }

/* ── Feed ── */
#feed { display: flex; flex-direction: column; gap: .65rem; }

/* ── Note Card ── */
.note-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem 1.25rem 1.25rem 1.6rem;
  transition: border-color .2s;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeUp .35s ease forwards;
  position: relative;
  overflow: hidden;
}
.note-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.note-card:hover { border-color: var(--border-hover); }

.note-card.type-diary::before        { background: var(--c-diary); }
.note-card.type-mood::before         { background: var(--c-mood); }
.note-card.type-fits::before,
.note-card.type-fit::before          { background: var(--c-fits); }
.note-card.type-reflexion::before,
.note-card.type-reflexionen::before  { background: var(--c-reflexion); }
.note-card.type-symptome::before,
.note-card.type-symptom::before      { background: var(--c-symptome); }
.note-card.type-therapie::before     { background: var(--c-therapie); }
.note-card.type-project_log::before,
.note-card.type-projectlog::before   { background: var(--c-projekt); }
.note-card.type-idea::before,
.note-card.type-ideas::before        { background: var(--c-idea); }
.note-card.type-arbeit::before       { background: var(--c-arbeit); }

.note-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: .6rem;
}
.note-type-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid currentColor;
  opacity: .85;
}
.badge-diary       { color: var(--c-diary); }
.badge-mood        { color: var(--c-mood); }
.badge-fits,
.badge-fit         { color: var(--c-fits); }
.badge-reflexion,
.badge-reflexionen { color: var(--c-reflexion); }
.badge-symptome,
.badge-symptom     { color: var(--c-symptome); }
.badge-therapie    { color: var(--c-therapie); }
.badge-project_log,
.badge-projectlog  { color: var(--c-projekt); }
.badge-idea,
.badge-ideas       { color: var(--c-idea); }
.badge-arbeit      { color: var(--c-arbeit); }

.note-date {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
}
.note-title {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -.01em;
  margin-bottom: .5rem;
  color: var(--text);
}

/* ── Markdown body ── */
.note-body {
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.8;
  word-break: break-word;
}
.note-body h1, .note-body h2, .note-body h3 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  color: var(--text);
  margin: .75rem 0 .3rem;
  letter-spacing: -.01em;
}
.note-body h1 { font-size: .95rem; }
.note-body h2 { font-size: .88rem; }
.note-body h3 { font-size: .82rem; color: var(--muted); }
.note-body strong { color: var(--text); font-weight: 500; }
.note-body em { font-style: italic; opacity: .85; }
.note-body hr { border: none; border-top: 1px solid var(--border); margin: .75rem 0; }
.note-body p { margin-bottom: .4rem; }
.note-body p:last-child { margin-bottom: 0; }
.note-body ul, .note-body ol { margin: .4rem 0 .5rem 1.2rem; }
.note-body li { margin-bottom: .2rem; }
.note-body blockquote {
  border-left: 3px solid rgba(255,255,255,.15);
  margin: .4rem 0;
  padding: .1rem 0 .1rem .75rem;
  color: rgba(232,230,224,.5);
}
.note-body blockquote p { margin: 0; }
.note-body code {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  background: rgba(255,0,81,.06);
  border: 1px solid rgba(255,0,81,.2);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--c-fits);
}

/* ── Timeline ── */
.md-timeline { margin: .75rem 0; position: relative; padding-left: 0; }
.md-timeline-track { position: absolute; left: 90px; top: 8px; bottom: 8px; width: 1px; background: var(--border); }
.md-timeline-item { display: grid; grid-template-columns: 80px 20px 1fr; gap: 0 10px; margin-bottom: 1rem; align-items: start; }
.md-timeline-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-align: right; padding-top: 2px; line-height: 1.4; }
.md-timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin-top: 3px; flex-shrink: 0; position: relative; z-index: 1; }
.md-timeline-content { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .85rem; }
.md-timeline-title { font-family: 'Syne', sans-serif; font-size: .88rem; font-weight: 700; color: var(--text); margin-bottom: .2rem; }
.md-timeline-body { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); line-height: 1.65; }

/* ── Expand ── */
.note-body-full { display: none; }
.note-card.expanded .note-body-preview { display: none; }
.note-card.expanded .note-body-full { display: block; }
.note-expand {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--c-ui);
  cursor: pointer;
  margin-top: .5rem;
  display: inline-block;
  background: none;
  border: none;
  padding: 0;
  letter-spacing: .04em;
}
.note-expand:hover { opacity: .7; }

/* ── Entry tags ── */
.entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: .5rem; }
.entry-tag { font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
.entry-actions { display: flex; gap: .5rem; margin-top: .6rem; }

/* ── Shared small-action button (matches worktracker's Bearbeiten/+Pause/Löschen buttons —
   same class as health.bensn.me, kept identical across services on purpose) ── */
.btn-pill { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.btn-pill:hover { border-color: var(--border-hover); color: var(--text); }
.btn-pill.green { border-color: rgba(74,222,128,.3); color: var(--green); }
.btn-pill.red { border-color: rgba(255,0,81,.3); color: var(--accent-red); }

/* ── Photo Grid (Telegram-style) ── */
.photo-grid {
  margin-top: .75rem;
  border-radius: 10px;
  overflow: hidden;
  display: grid;
  gap: 3px;
  width: 100%;
}
/* Layout variants */
.photo-grid.n1 { grid-template-columns: 1fr; }
.photo-grid.n2 { grid-template-columns: 1fr 1fr; }
.photo-grid.n3 { grid-template-columns: 1fr 1fr; }
.photo-grid.n4 { grid-template-columns: 1fr 1fr; }
.photo-grid.n5 { grid-template-columns: 1fr 1fr; }

.photo-cell {
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,.04);
  cursor: pointer;
}
/* Aspect ratios per layout */
/* n1: no fixed ratio = full image height */
.photo-grid.n2 .photo-cell { aspect-ratio: 3/4; }
.photo-grid.n3 .photo-cell:first-child { grid-column: 1 / -1; aspect-ratio: 16/9; }
.photo-grid.n3 .photo-cell:not(:first-child) { aspect-ratio: 3/4; }
.photo-grid.n4 .photo-cell { aspect-ratio: 1/1; }
.photo-grid.n5 .photo-cell:nth-child(-n+2) { aspect-ratio: 3/4; }
.photo-grid.n5 .photo-cell:nth-child(n+3) { aspect-ratio: 1/1; }

/* landscape detection — set via JS after load */
.photo-cell.landscape { aspect-ratio: 4/3 !important; }
.photo-grid.n2 .photo-cell.landscape { aspect-ratio: 16/9 !important; }

.photo-cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: opacity .2s;
}
.photo-grid.n1 .photo-cell img {
  height: auto;
  object-position: center;
}
.photo-cell:hover img { opacity: .88; }

/* +N more overlay */
.photo-more {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: #fff;
  pointer-events: none;
}

.state-msg {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 3rem 1rem;
  border: 1px dashed var(--border);
  border-radius: 16px;
  line-height: 1.8;
}

.load-more {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 20px;
  cursor: pointer;
  margin: 1.5rem auto 0;
  display: block;
  transition: border-color .15s, color .15s;
}
.load-more:hover { border-color: var(--c-ui); color: var(--c-ui); }

footer {
  border-top: 1px solid var(--border);
  padding: 2rem 0 0;
  display: flex;
  justify-content: space-between;
  margin-top: auto;
}

/* ── Lightbox ── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
#lightbox.open { display: flex; }
#lightbox-img {
  max-width: 96vw;
  max-height: 88vh;
  object-fit: contain;
  border-radius: 6px;
  user-select: none;
}
#lightbox-close {
  position: fixed; top: 1.25rem; right: 1.25rem;
  width: 36px; height: 36px;
  background: rgba(255,255,255,.1); border: none; border-radius: 50%;
  color: #fff; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
#lightbox-close:hover { background: rgba(255,255,255,.2); }
#lightbox-prev, #lightbox-next {
  position: fixed; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.08); border: none; border-radius: 50%;
  width: 44px; height: 44px; color: #fff; font-size: 1.2rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
#lightbox-prev { left: 1rem; }
#lightbox-next { right: 1rem; }
#lightbox-prev:hover, #lightbox-next:hover { background: rgba(255,255,255,.18); }
#lightbox-counter {
  position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: rgba(255,255,255,.5); pointer-events: none;
}

/* ── oEmbed Cards ── */
.embed-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin: .5rem 0;
  transition: border-color .15s;
  background: var(--surface);
}
.embed-card:hover { border-color: var(--border-hover); }
.embed-loading {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  padding: .75rem 1rem;
}
.embed-inner {
  display: flex;
  align-items: center;
  gap: .85rem;
  padding: .75rem;
  text-decoration: none;
  color: inherit;
}
.embed-thumb {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: 5px;
  flex-shrink: 0;
  background: rgba(255,255,255,.05);
}
.embed-thumb-wrap {
  position: relative;
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}
.embed-thumb-wrap .embed-thumb { width: 100%; height: 100%; }
.embed-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.45);
  color: #fff;
  font-size: .85rem;
  border-radius: 5px;
}
.embed-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.embed-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.embed-badge-spotify { color: #1DB954; }
.embed-badge-youtube { color: #FF0000; }
.embed-title {
  font-family: 'Syne', sans-serif;
  font-size: .85rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.embed-artist {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.embed-arrow {
  font-size: .9rem;
  color: var(--muted);
  flex-shrink: 0;
  opacity: .5;
}
.embed-card-spotify { border-left: 2px solid #1DB954; }
.embed-card-youtube { border-left: 2px solid #FF0000; }

/* ── Work / Schicht Cards ── */
/* ── Stats Drawer ── */
.stats-drawer-toggle { display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:.4rem 0 .6rem; cursor:pointer; background:none; border:none; width:100%; transition:color .15s; }
.stats-drawer-toggle:hover { color:var(--text); }
.stats-drawer-toggle .arrow { font-size:9px; transition:transform .2s; display:inline-block; }
.stats-drawer-toggle.open .arrow { transform:rotate(180deg); }
.stats-drawer { max-height:0; overflow:hidden; transition:max-height .25s ease; border-bottom:1px solid var(--border); margin-bottom:1rem; }
.stats-drawer.open { max-height:300px; }
.stats-drawer-inner { padding:.5rem 0 .75rem; }

<script>
/* ── Auth ── */
/* Auth wird vom Cookie übernommen — kein JS-Login nötig */

/* ── Clock ── */
function pad(n){return String(n).padStart(2,'0')}
function clockTick(){
  const n=new Date(),el=document.getElementById('footer-clock');
  if(el) el.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
clockTick(); setInterval(clockTick,1000);

/* ── State ── */
let allNotes=[], activeTypes=new Set(), page=0, searchQuery='', wikiFilter='';
const PAGE_SIZE=20, MAX_VISIBLE_PHOTOS=5;

/* ── Lightbox ── */
let _lbImages=[],_lbIdx=0;
function openLightbox(images,idx){
  _lbImages=images; _lbIdx=idx; _showLb();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
function lightboxStep(dir){_lbIdx=(_lbIdx+dir+_lbImages.length)%_lbImages.length; _showLb();}
function _showLb(){
  const img=_lbImages[_lbIdx];
  document.getElementById('lightbox-img').src=img.url;
  document.getElementById('lightbox-img').alt=img.alt||'';
  document.getElementById('lightbox-counter').textContent=(_lbIdx+1)+' / '+_lbImages.length;
  document.getElementById('lightbox-prev').style.display=_lbImages.length>1?'flex':'none';
  document.getElementById('lightbox-next').style.display=_lbImages.length>1?'flex':'none';
}
document.getElementById('lightbox').addEventListener('click',function(e){
  if(e.target===document.getElementById('lightbox')) closeLightbox();
});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lightboxStep(-1);
  if(e.key==='ArrowRight') lightboxStep(1);
});

/* ── Photo Grid ── */
function buildPhotoGrid(images){
  const total=images.length, visible=images.slice(0,MAX_VISIBLE_PHOTOS), hidden=total-MAX_VISIBLE_PHOTOS;
  const n=Math.min(total,MAX_VISIBLE_PHOTOS);
  const grid=document.createElement('div');
  grid.className='photo-grid n'+n;
  visible.forEach(function(img,idx){
    const cell=document.createElement('div');
    cell.className='photo-cell';
    const el=document.createElement('img');
    el.src=img.url; el.alt=img.alt||''; el.loading='lazy';
    el.addEventListener('load',function(){
      if(el.naturalWidth>el.naturalHeight) cell.classList.add('landscape');
    });
    el.addEventListener('error',function(){cell.style.display='none';});
    cell.addEventListener('click',function(){openLightbox(images,idx);});
    cell.appendChild(el);
    if(hidden>0&&idx===MAX_VISIBLE_PHOTOS-1){
      const ov=document.createElement('div');
      ov.className='photo-more'; ov.textContent='+'+hidden;
      cell.appendChild(ov);
    }
    grid.appendChild(cell);
  });
  return grid;
}

/* ── Timeline ── */
function parseTimeline(content){
  const lines=content.split('\n');
  let start=0;
  if(lines[0]&&lines[0].trim().startsWith('[')) start=1;
  const blocks=[]; let blk=[];
  for(let i=start;i<lines.length;i++){
    if(lines[i].trim()===''){if(blk.length){blocks.push(blk);blk=[];}}
    else{blk.push(lines[i]);}
  }
  if(blk.length) blocks.push(blk);
  const items=[];
  for(const b of blocks){
    const plusLines=b.filter(function(l){return l.trim().startsWith('+');});
    if(!plusLines.length) continue;
    const date=plusLines[0].trim().slice(1).trim();
    const title=plusLines[1]?plusLines[1].trim().slice(1).trim():'';
    const bodyLines=[]; let plusCount=0;
    for(const l of b){
      if(l.trim().startsWith('+')){plusCount++;if(plusCount>2)bodyLines.push(l.trim().slice(1).trim());}
      else if(plusCount>=2&&l.trim()) bodyLines.push(l.trim());
    }
    items.push({date:date,title:title,body:bodyLines});
  }
  return items;
}
function renderTimeline(content){
  const items=parseTimeline(content);
  if(!items.length) return '<pre style="font-size:10px;color:var(--muted)">'+escHtml(content)+'</pre>';
  let html='<div class="md-timeline"><div class="md-timeline-track"></div>';
  items.forEach(function(item){
    html+='<div class="md-timeline-item">'
      +'<div class="md-timeline-date">'+escHtml(item.date)+'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;padding-top:3px"><div class="md-timeline-dot"></div></div>'
      +'<div class="md-timeline-content">'
      +(item.title?'<div class="md-timeline-title">'+escHtml(item.title)+'</div>':'')
      +(item.body.length?'<div class="md-timeline-body">'+item.body.map(escHtml).join('<br>')+'</div>':'')
      +'</div></div>';
  });
  return html+'</div>';
}

/* ── Helpers ── */
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function normalize(s){return(s||'').toLowerCase().replace(/[-_\s]+/g,' ').replace(/[^a-z0-9äöüß ]/g,'').trim();}
function typeColor(type){
  const m={diary:'#e5b181',mood:'#b8ebd0',fits:'#C9B6BE',fit:'#C9B6BE',
    reflexion:'#ffb400',reflexionen:'#ffb400',symptome:'#f96f5d',symptom:'#f96f5d',
    therapie:'#9c3848',arbeit:'#065143',project_log:'#1d4e89',projectlog:'#1d4e89',
    idea:'#6622cc',ideas:'#6622cc',
    work_start:'#3BC14A',work_pause:'#3BC14A',work_end:'#3BC14A',
    medication_taken:'#22d3d3',bp_reading:'#22d3d3',meal_logged:'#22d3d3'};
  return m[(type||'').toLowerCase()]||'var(--muted)';
}
/* ── oEmbed: Spotify + YouTube ── */

function extractMediaUrl(line) {
  // Match raw URL or markdown link [text](url)
  const mdMatch = line.match(/\[([^\]]*)\]\((https?:\/\/[^)]+)\)/);
  const url = mdMatch ? mdMatch[2] : line.trim();
  
  const spotify = url.match(/https:\/\/open\.spotify\.com\/(?:[a-z-]+\/)*(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
  if(spotify) return { type: 'spotify', url: url, kind: spotify[1], id: spotify[2] };
  
  const ytFull = url.match(/https:\/\/(?:www\.)?youtube\.com\/watch\?v=([A-Za-z0-9_-]+)/);
  const ytShort = url.match(/https:\/\/youtu\.be\/([A-Za-z0-9_-]+)/);
  const yt = ytFull || ytShort;
  if(yt) return { type: 'youtube', url: url, id: yt[1] };
  
  return null;
}

function isMediaLine(line) {
  const t = line.trim();
  if(!t) return false;
  return !!(extractMediaUrl(t));
}

function buildSpotifyCard(media) {
  const el = document.createElement('div');
  el.className = 'embed-card embed-spotify';
  // Normalize URL: strip intl-de/ and ?si= params for embed
  const cleanId = media.id;
  const embedUrl = 'https://open.spotify.com/embed/' + media.kind + '/' + cleanId + '?utm_source=generator&theme=0';
  el.innerHTML =
    '<iframe style="border-radius:8px;width:100%;height:80px;border:none;margin-top:.25rem" '
    + 'src="' + embedUrl + '" '
    + 'allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" '
    + 'loading="lazy"></iframe>';
  return el;
}

function buildYouTubeCard(media) {
  const el = document.createElement('div');
  el.className = 'embed-card embed-youtube';
  const thumb = 'https://i.ytimg.com/vi/' + media.id + '/hqdefault.jpg';
  el.innerHTML =
    '<a class="embed-inner" href="' + media.url + '" target="_blank" rel="noopener">'
    + '<div class="embed-thumb-wrap"><img class="embed-thumb" src="' + thumb + '" alt="" loading="lazy"><div class="embed-play">▶</div></div>'
    + '<div class="embed-info">'
    + '<div class="embed-badge embed-badge-youtube">YouTube</div>'
    + '<div class="embed-title" id="yt-title-' + media.id + '">Laden…</div>'
    + '</div>'
    + '<div class="embed-arrow">↗</div>'
    + '</a>';
  // Fetch title via noembed.com (public, no API key, no IP blocks)
  fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(media.url) + '&format=json')
    .then(function(r){return r.json();})
    .then(function(d){
      const t = document.getElementById('yt-title-' + media.id);
      if(t) t.textContent = d.title || media.url;
    })
    .catch(function(){
      const t = document.getElementById('yt-title-' + media.id);
      if(t) t.textContent = media.url;
    });
  return el;
}

function inlineFmt(s,noteType){
  const lc=typeColor(noteType);
  return s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\[\[([^\]|]+)\|?([^\]]*)\]\]/g,function(m,p1,p2){
      return '<span class="wiki-link" style="color:'+lc+'" data-wiki="'+escHtml(p1.trim())+'" onclick="setWikiFilter(this.dataset.wiki)">'+escHtml(p2||p1)+'</span>';
    })
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function renderMarkdown(raw,cleanedTitle,noteType){
  if(!raw) return '';
  let lines=raw.split('\n');
  while(lines.length&&lines[0].trim()==='') lines.shift();
  if(lines.length&&/^#\s+/.test(lines[0].trim())){
    const h1text=lines[0].trim().replace(/^#+\s+/,'').trim();
    const isDateH1=/^\d{1,2}\.\s+\w+\s+\d{4}/.test(h1text)||/^Mood\s*[–-]/.test(h1text)||/^\d{4}-\d{2}-/.test(h1text)||/^Fit\s*[–-]/.test(h1text);
    const isTitleDupe=cleanedTitle&&normalize(h1text)===normalize(cleanedTitle);
    if(isDateH1||isTitleDupe) lines.shift();
  }
  while(lines.length&&lines[0].trim()==='') lines.shift();
  lines=lines.filter(function(l){return !/^!\[/.test(l.trim());});
  while(lines.length&&lines[lines.length-1].trim()==='') lines.pop();
  const html=[]; let i=0;
  while(i<lines.length){
    const t=lines[i].trim();
    if(t.startsWith('```')){
      const lang=t.slice(3).trim().toLowerCase();
      const blockLines=[]; i++;
      while(i<lines.length&&!lines[i].trim().startsWith('```')){blockLines.push(lines[i]);i++;}
      i++;
      if(lang==='timeline') html.push(renderTimeline(blockLines.join('\n')));
      else html.push('<pre style="font-family:\'DM Mono\',monospace;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:.75rem;overflow-x:auto;margin:.5rem 0">'+escHtml(blockLines.join('\n'))+'</pre>');
      continue;
    }
    if(!t){html.push('<br>');i++;continue;}
    if(/^### /.test(t)){html.push('<h3>'+inlineFmt(t.slice(4),noteType)+'</h3>');i++;continue;}
    if(/^## /.test(t)){html.push('<h2>'+inlineFmt(t.slice(3),noteType)+'</h2>');i++;continue;}
    if(/^# /.test(t)){html.push('<h1>'+inlineFmt(t.slice(2),noteType)+'</h1>');i++;continue;}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){html.push('<hr>');i++;continue;}
    if(/^[-*] /.test(t)){
      html.push('<ul>');
      while(i<lines.length&&/^[-*] /.test(lines[i].trim())){html.push('<li>'+inlineFmt(lines[i].trim().slice(2),noteType)+'</li>');i++;}
      html.push('</ul>');continue;
    }
    if(/^\d+\. /.test(t)){
      html.push('<ol>');
      while(i<lines.length&&/^\d+\. /.test(lines[i].trim())){html.push('<li>'+inlineFmt(lines[i].trim().replace(/^\d+\. /,''),noteType)+'</li>');i++;}
      html.push('</ol>');continue;
    }
    if(/^> /.test(t)){
      html.push('<blockquote>');
      while(i<lines.length&&/^> /.test(lines[i].trim())){html.push('<p>'+inlineFmt(lines[i].trim().slice(2),noteType)+'</p>');i++;}
      html.push('</blockquote>');continue;
    }
    const _media=extractMediaUrl(t);
    if(_media){html.push('<span class="embed-placeholder" data-embed="'+escHtml(JSON.stringify(_media))+'"></span>');i++;continue;}
    html.push('<p>'+inlineFmt(t,noteType)+'</p>');i++;
  }
  return html.join('').replace(/(<br>){3,}/g,'<br><br>');
}

const TYPE_WORDS=['diary','mood','fits','fit','reflexion','reflexionen','symptome','symptom','therapie','arbeit','projectlog','project_log','idea','ideas'];
function cleanTitle(title){
  if(!title) return '';
  let t=title.trim();
  TYPE_WORDS.forEach(function(w){t=t.replace(new RegExp('^'+w+'[\\s_-]*','i'),'');});
  t=t.replace(/^\d{4}-\d{2}-\d{2}(-\d{4})?[-_]?/,'');
  return t.trim();
}
function fmtTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Vienna'});
}
function fmtDayLabel(iso){
  if(!iso) return '—';
  const vn=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Vienna'});
  const vd=new Date(iso).toLocaleDateString('en-CA',{timeZone:'Europe/Vienna'});
  const a=vn.split('-').map(Number),b=vd.split('-').map(Number);
  const diff=Math.round((new Date(a[0],a[1]-1,a[2])-new Date(b[0],b[1]-1,b[2]))/86400000);
  if(diff===0) return 'Heute';
  if(diff===1) return 'Gestern';
  return new Date(iso).toLocaleDateString('de-AT',{weekday:'long',day:'2-digit',month:'long',timeZone:'Europe/Vienna'});
}
function dayKey(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleDateString('en-CA',{timeZone:'Europe/Vienna'});
}
function typeLabel(type){
  const map={diary:'Diary',mood:'Mood',fits:'Fits',fit:'Fits',reflexion:'Reflection',reflexionen:'Reflection',
    symptome:'Symptoms',symptom:'Symptoms',therapie:'Therapy',arbeit:'Work',
    project_log:'Project',projectlog:'Project',idea:'Idea',ideas:'Idea',
    work_start:'Dienstbeginn',work_pause:'Pause',work_end:'Dienstende',
    medication_taken:'Medikament',bp_reading:'Blutdruck',meal_logged:'Mahlzeit'};
  return map[(type||'').toLowerCase()]||type||'Note';
}
function badgeClass(type){return 'badge-'+(type||'').toLowerCase().replace(/\s/g,'_');}
function processEmbeds(container){
  container.querySelectorAll('.embed-placeholder').forEach(function(span){
    try{
      const media=JSON.parse(span.getAttribute('data-embed'));
      let card;
      if(media.type==='spotify') card=buildSpotifyCard(media);
      else if(media.type==='youtube') card=buildYouTubeCard(media);
      if(card) span.parentNode.replaceChild(card,span);
    }catch(e){}
  });
}

/* ── Search ── */
function highlight(text,query){
  if(!query||!text) return escHtml(text||'');
  const esc=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return escHtml(text).replace(new RegExp('('+esc+')','gi'),'<mark>$1</mark>');
}
function noteMatchesSearch(note,q){
  if(!q) return true;
  const lower=q.toLowerCase();
  return (note.title||'').toLowerCase().includes(lower)
      ||(note.content||'').toLowerCase().includes(lower)
      ||(note.type||'').toLowerCase().includes(lower);
}

function fmtDuration(min){

}

function renderNote(note,idx){
  const type=(note.type||'').toLowerCase();
  if(type==='work_start'||type==='work_pause'||type==='work_end') return renderWorkEvent(note,idx);
  if(type==='medication_taken'||type==='bp_reading'||type==='meal_logged') return renderHealthEvent(note,idx);
  const id='note-'+idx,raw=note.content||'',ct=cleanTitle(note.title);
  const el=document.createElement('div');
  el.id=id; el.className='note-card type-'+type; el.style.animationDelay=(idx%PAGE_SIZE*35)+'ms';
  const titleDisplay=searchQuery&&ct?highlight(ct,searchQuery):escHtml(ct);
  const titleHtml=ct&&ct.length>1?'<div class="note-title">'+titleDisplay+'</div>':'';
  const metaHtml='<div class="note-meta"><span class="note-type-badge '+badgeClass(type)+'">'+typeLabel(type)+'</span><span class="note-date">'+fmtTime(note.date)+'</span></div>';
  const extraHtml=moodVizHtml(note);
  const footerHtml=tagsHtml(note)+entryActionsHtml(note);
  if(note.images&&note.images.length>0){
    const grid=buildPhotoGrid(note.images);
    const textOnly=raw.split('\n').filter(function(l){return !/^!\[/.test(l.trim());}).join('\n').trim();
    el.innerHTML=metaHtml+titleHtml+extraHtml;
    el.appendChild(grid);
    if(textOnly){const body=document.createElement('div');body.className='note-body';body.style.marginTop='.75rem';body.innerHTML=renderMarkdown(textOnly,ct,type);el.appendChild(body);}
    el.insertAdjacentHTML('beforeend',footerHtml);
    processEmbeds(el);
  } else if(raw.length>400){
    const shortRaw=raw.slice(0,400).trimEnd()+'…';
    const contentMatch=searchQuery&&(raw.toLowerCase().includes(searchQuery.toLowerCase()))&&!(ct&&ct.toLowerCase().includes(searchQuery.toLowerCase()));
    const autoExpand=contentMatch;
    el.innerHTML=metaHtml+titleHtml+extraHtml
      +'<div class="note-body note-body-preview">'+renderMarkdown(shortRaw,ct,type)+'</div>'
      +'<div class="note-body note-body-full">'+renderMarkdown(raw,ct,type)+'</div>'
      +'<button class="note-expand" onclick="toggleExpand(\''+id+'\',this)">'+(autoExpand?'less ▴':'more ▾')+'</button>'
      +footerHtml;
    if(autoExpand) el.classList.add('expanded');
    processEmbeds(el);
  } else {
    el.innerHTML=metaHtml+titleHtml+extraHtml+'<div class="note-body">'+renderMarkdown(raw,ct,type)+'</div>'+footerHtml;
    processEmbeds(el);
  }
  return el;
}

/* Visualizes valenz/tags for natively-composed mood entries (journal_entries.fields).
   Obsidian-authored mood notes have no such structured meta, so they just render as
   plain markdown text below — this only kicks in once fields.valenz is present. */
function moodVizHtml(note){
  if((note.type||'').toLowerCase()!=='mood') return '';
  const f=note.meta||{};
  if(f.valenz===undefined||f.valenz===null||f.valenz==='') return '';
  const v=parseInt(f.valenz,10);
  const pct=(v+100)/2;
  const color=v<0?'#f96f5d':'#b8ebd0';
  let html='<div class="mood-bar-track"><div class="mood-bar-fill" style="left:'+(v<0?pct:50)+'%;width:'+Math.abs(pct-50)+'%;background:'+color+'"></div></div>';
  const allTags=[].concat(f.zusammenhang||[],f.beschreibung||[]);
  if(allTags.length) html+='<div class="mood-tags">'+allTags.map(function(t){return '<span class="mood-tag">'+escHtml(t)+'</span>';}).join('')+'</div>';
  if(String(f.tagesreflexion).toLowerCase()==='true') html+='<div class="mood-tag" style="display:inline-block;margin-bottom:.4rem">Tagesreflexion</div>';
  return html;
}

function renderFeed(notes,append){
  append=append||false;
  const feed=document.getElementById('feed');
  const lm=document.querySelector('.load-more'); if(lm) lm.remove();
  if(!append){feed.innerHTML='';page=0;}
  if(!notes.length&&!append){feed.innerHTML='<div class="state-msg">Keine Einträge gefunden.</div>';return;}
  const start=page*PAGE_SIZE,slice=notes.slice(start,start+PAGE_SIZE);
  let lastDay=append?(feed.dataset.lastDay||''):'';
  slice.forEach(function(note,i){
    const day=dayKey(note.date);
    if(day!==lastDay){
      const sep=document.createElement('div');sep.className='day-sep';
      sep.innerHTML='<span class="day-sep-label">'+fmtDayLabel(note.date)+'</span><div class="day-sep-line"></div>';
      feed.appendChild(sep);lastDay=day;
    }
    feed.appendChild(renderNote(note,start+i));
  });
  feed.dataset.lastDay=lastDay;
  if(notes.length>start+PAGE_SIZE){
    const btn=document.createElement('button');btn.className='load-more';btn.textContent='Load more';
    btn.onclick=function(){page++;renderFeed(notes,true);};feed.after(btn);
  }
}

function typeMatches(noteType,filterType){
  const t=(noteType||'').toLowerCase();
  if(filterType==='fits') return t==='fits'||t==='fit';
  if(filterType==='reflexion') return t==='reflexion'||t==='reflexionen';
  if(filterType==='symptome') return t==='symptome'||t==='symptom';
  if(filterType==='projekt') return t==='project_log'||t==='projectlog';
  if(filterType==='idea') return t==='idea'||t==='ideas';
  if(filterType==='schicht') return t==='work_start'||t==='work_pause'||t==='work_end';
  if(filterType==='health') return t==='medication_taken'||t==='bp_reading'||t==='meal_logged';
  return t===filterType;
}
function getFilteredNotes(){
  let filtered=allNotes;
  // activeTypes = set of types that are ACTIVE (visible). If all active, show all.
  const allBtns=document.querySelectorAll('#filterBar .filter-btn');
  const allActive=allBtns.length===0||document.querySelectorAll('#filterBar .filter-btn.active').length===allBtns.length;
  if(!allActive && activeTypes.size>0){
    filtered=filtered.filter(function(n){
      return Array.from(activeTypes).some(function(ft){return typeMatches(n.type,ft);});
    });
  } else if(!allActive && activeTypes.size===0){
    // All deactivated = show nothing
    filtered=[];
  }
  if(wikiFilter){
    filtered=filtered.filter(function(n){
      if(!n.content) return false;
      const rx=new RegExp('\\[\\['+wikiFilter.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\|[^\\]]*)?\\]\\]','i');
      return rx.test(n.content);
    });
  }
  if(searchQuery){
    filtered=filtered.filter(function(n){return noteMatchesSearch(n,searchQuery);});
  }
  return filtered;
}

  const counts={};
  allNotes.forEach(function(n){
    if(!n.content) return;
    var rx=/\[\[([^\]|]+)(?:\|[^\]]*)?\]\]/g, m;
    while((m=rx.exec(n.content))!==null){ var link=m[1].trim(); counts[link]=(counts[link]||0)+1; }
  });
  var sorted=Object.entries(counts).sort(function(a,b){return b[1]-a[1];}).slice(0,40);
  var grid=document.getElementById('wikiStatsGrid');

  grid.innerHTML=sorted.map(function(e){

    filtersWrap.classList.add('tb-hidden');
    searchWrap.classList.remove('tb-hidden');
    filterToggle.classList.remove('tb-active');
    searchToggle.classList.add('tb-active');
    setTimeout(function(){searchInput.focus();},80);
  } else {
    searchWrap.classList.add('tb-hidden');
    filtersWrap.classList.remove('tb-hidden');
    filterToggle.classList.add('tb-active');
    searchToggle.classList.remove('tb-active');
    if(searchQuery!==''){
      searchQuery='';
      searchInput.value='';
      applyFilter();
    }
  }
}
document.getElementById('filterToggle').addEventListener('click',function(){
  setToolbarMode('filters');
});
document.getElementById('searchToggle').addEventListener('click',function(){
  setToolbarMode(tbMode==='search'?'filters':'search');
});
document.getElementById('searchInput').addEventListener('input',function(){
  searchQuery=this.value.trim();
  applyFilter();
});
document.getElementById('searchInput').addEventListener('keydown',function(e){
  if(e.key==='Escape') setToolbarMode('filters');
});
document.getElementById('filterBar').addEventListener('click',function(e){
  const btn=e.target.closest('.filter-btn');if(!btn)return;
  const type=btn.dataset.type;
  if(btn.classList.contains('active')){
    // Deactivate this type
    btn.classList.remove('active');
    activeTypes.delete(type);
  } else {
    // Re-activate this type
    btn.classList.add('active');
    activeTypes.add(type);
  }
  applyFilter();
});

async function loadFeed(){
  const dot=document.getElementById('statusDot'),st=document.getElementById('statusText');
  try{
    const r=await fetch('/api/feed/combined?limit=5000');
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    allNotes=data.notes||[];
    dot.style.background='var(--green)';dot.style.animation='pulse 2s ease-in-out infinite';
    st.textContent=allNotes.length+' entries';
    activeTypes.clear();
    document.querySelectorAll('#filterBar .filter-btn').forEach(function(b){ activeTypes.add(b.dataset.type); });
    buildWikiStats();
    renderFeed(allNotes);
  }catch(e){
    dot.style.background='var(--accent-red)';dot.style.animation='none';st.textContent='error';
    document.getElementById('feed').innerHTML='<div class="state-msg">Verbindungsfehler<br><span style="font-size:11px;color:var(--accent-red)">'+e.message+'</span></div>';
  }
}

/* ── Compose: generischer Eintrag (8 Typen außer Mood) ── */
const UPLOAD_API_KEY='3dbdb54401dd731f5e454053cd64606f6978986a8312bdab991bf9264210d152';
const ENTRY_TYPE_CONFIG={
  diary:{label:'Diary',color:'#e5b181',bodyTemplate:'',extraFields:[
    {key:'tagesreflexion',label:'Tagesreflexion',type:'toggle'}]},
  reflexion:{label:'Reflexion',color:'#ffb400',bodyTemplate:'',extraFields:[
    {key:'mood',label:'Stimmung (1-5, optional)',type:'number'}]},
  symptome:{label:'Symptom',color:'#f96f5d',bodyTemplate:'## Was\n\n## Kontext\n\n## Verlauf\n\n## Maßnahmen\n',extraFields:[
    {key:'kategorie',label:'Kategorie (Komma-getrennt)',type:'tags'}]},

    {key:'session_nr',label:'Sitzung Nr. (optional)',type:'text'},

  fits:{label:'Fit',color:'#C9B6BE',bodyTemplate:'',allowImage:true,extraFields:[
    {key:'location',label:'Ort (optional)',type:'text'},

  arbeit:{label:'Arbeit',color:'#065143',bodyTemplate:'## Was war heute erwähnenswert?\n\n## Stimmung / Atmosphäre\n\n## Offenes / Follow-up\n',extraFields:[]},
  ideas:{label:'Idea',color:'#6622cc',bodyTemplate:'## Die Idee\n\n## Ausführlicher\n\n## Warum interessant?\n\n## Nächster Schritt\n',extraFields:[
    {key:'status',label:'Status',type:'select',options:['raw','exploring','parked','active','done']},
    {key:'bereich',label:'Bereich',type:'select',options:['coding','music','fashion','creative','life','other']}]},
  project_log:{label:'Project Log',color:'#1d4e89',bodyTemplate:'## Was wurde gemacht?\n\n## Ergebnis / Stand\n\n## Blocker / Offenes\n\n## Nächste Schritte\n',extraFields:[
    {key:'project',label:'Projekt (optional)',type:'text'}]},
  mood:{label:'Mood',color:'#b8ebd0'},
};
let _genericImageUrl=null;

function extraFieldHtml(f){
  var id='genericField_'+f.key;
  if(f.type==='toggle'){
    return '<div class="toggle-row"><span>'+escHtml(f.label)+'</span><button class="tag-btn" id="'+id+'" data-on="false" onclick="var b=this;b.dataset.on=(b.dataset.on!==\'true\');b.classList.toggle(\'active\');b.textContent=b.dataset.on===\'true\'?\'Ja\':\'Nein\'">Nein</button></div>';
  }
  if(f.type==='select'){
    return '<div class="sheet-label">'+escHtml(f.label)+'</div><div class="input-row"><select id="'+id+'" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:\'DM Mono\',monospace;font-size:12px">'
      +f.options.map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('')+'</select></div>';
  }
  if(f.type==='number'){
    return '<div class="sheet-label">'+escHtml(f.label)+'</div><div class="input-row"><input type="number" id="'+id+'" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:\'DM Mono\',monospace;font-size:12px"></div>';
  }
  // 'text' or 'tags' both render as a plain text input; 'tags' gets comma-split on save
  return '<div class="sheet-label">'+escHtml(f.label)+'</div><div class="input-row"><input type="text" id="'+id+'" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:\'DM Mono\',monospace;font-size:12px"></div>';
}

function openGenericEntrySheet(type){
  var cfg=ENTRY_TYPE_CONFIG[type];
  document.getElementById('sheetGeneric').dataset.type=type;
  document.getElementById('genericSheetTitle').textContent='Neuer Eintrag · '+cfg.label;
  document.getElementById('genericTitle').value='';
  document.getElementById('genericTags').value='';
  document.getElementById('genericDatetime').value=nowForDatetimeLocal();
  document.getElementById('genericBody').value=cfg.bodyTemplate||'';
  document.getElementById('genericExtraFields').innerHTML=cfg.extraFields.map(extraFieldHtml).join('');
  _genericImageUrl=null;
  document.getElementById('genericImagePreview').textContent='';
  var imgRow=document.getElementById('genericImageRow');
  imgRow.style.display=cfg.allowImage?'block':'none';
  document.getElementById('genericImageInput').value='';
  document.getElementById('sheetGeneric').classList.add('visible');
}

document.getElementById('genericImageInput').addEventListener('change',async function(e){
  var file=e.target.files[0];
  if(!file) return;
  var preview=document.getElementById('genericImagePreview');
  preview.textContent='Lädt hoch…';
  try{
    var fd=new FormData();
    fd.append('file',file);
    var r=await fetch('/api/upload',{method:'POST',headers:{'X-API-Key':UPLOAD_API_KEY},body:fd});
    if(!r.ok) throw new Error(r.status);
    var text=(await r.text()).trim();
    _genericImageUrl=text.split('\n')[0];
    preview.textContent='✓ hochgeladen';
  }catch(err){
    preview.textContent='Upload fehlgeschlagen: '+err.message;
  }
});

async function saveGenericEntry(){
  var type=document.getElementById('sheetGeneric').dataset.type;
  var cfg=ENTRY_TYPE_CONFIG[type];
  var fields={};
  cfg.extraFields.forEach(function(f){
    var el=document.getElementById('genericField_'+f.key);
    if(!el) return;
    if(f.type==='toggle') fields[f.key]=el.dataset.on==='true';
    else if(f.type==='tags') fields[f.key]=el.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    else if(f.type==='number') fields[f.key]=el.value?parseInt(el.value,10):null;
    else fields[f.key]=el.value||null;
  });
  var tags=document.getElementById('genericTags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  var images=_genericImageUrl?[_genericImageUrl]:[];
  var body=document.getElementById('genericBody').value;
  var dtVal=document.getElementById('genericDatetime').value;
  if(_genericImageUrl) body='![](' + _genericImageUrl + ')\n\n' + body;
  try{
    var r=await fetch('/api/journal/entry',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        entry_type:type,
        entry_date:dtVal?new Date(dtVal).toISOString():null,
        title:document.getElementById('genericTitle').value||null,
        body:body,
        tags:tags,
        images:images,
        fields:fields
      })
    });
    if(!r.ok) throw new Error(r.status);
    closeComposeSheet();
    await loadFeed();
  }catch(e){
    alert('Speichern fehlgeschlagen: '+e.message);
  }
}

/* ── Compose: native Mood-Eintrag ── */
const ZUSAMMENHANG_TAGS=['Gesundheit','Fitness','Selbstfürsorge','Hobbys','Identität','Spiritualität','Gemeinschaft','Familie','Freund:innen','Partner:in','Beziehung & Partnersuche','Aufgaben','Arbeit','Bildung','Reisen','Wetter','Zeitgeschehen','Geld'];
const BESCHREIBUNG_TAGS=['Angewidert','Ängstlich','Aufgeregt','Ausgeglichen','Beschämt','Besorgt','Beunruhigt','Dankbar','Einsam','Entmutigt','Enttäuscht','Erfüllt','Erleichtert','Erschöpft','Erstaunt','Freudig','Frustriert','Genervt','Gereizt','Gestresst','Gleichgültig','Glücklich','Hoffnungslos','Hoffnungsvoll','Leidenschaftlich','Mutig','Neiderfüllt','Ruhig','Schuldig','Stolz','Traurig','Überfordert','Überrascht','Verärgert','Vergnügt','Verlegen','Zufrieden','Zuversichtlich'];
let _selectedZusammenhang=[],_selectedBeschreibung=[],_tagesreflexion=false;

function tagPickerHtml(tags,selected,groupName){
  return tags.map(function(t){
    var active=selected.indexOf(t)>=0;
    return '<button class="tag-btn'+(active?' active':'')+'" onclick="toggleComposeTag(\''+groupName+'\',\''+t.replace(/'/g,"\\'")+'\',this)">'+escHtml(t)+'</button>';
  }).join('');
}
function toggleComposeTag(group,tag,btn){
  var arr=group==='zusammenhang'?_selectedZusammenhang:_selectedBeschreibung;
  var i=arr.indexOf(tag);
  if(i>=0){arr.splice(i,1);btn.classList.remove('active');}
  else{arr.push(tag);btn.classList.add('active');}
}
function toggleTagesreflexion(btn){
  _tagesreflexion=!_tagesreflexion;
  btn.textContent=_tagesreflexion?'Ja':'Nein';
  btn.classList.toggle('active',_tagesreflexion);
}
/* Typ-Auswahl → routet zu Mood-Sheet oder generischem Sheet */
function openComposeSheet(){
  var el=document.getElementById('typePickerList');
  el.innerHTML=Object.keys(ENTRY_TYPE_CONFIG).map(function(t){
    var cfg=ENTRY_TYPE_CONFIG[t];
    return '<button class="tag-btn" style="border-color:'+cfg.color+';color:'+cfg.color+'" onclick="selectEntryType(\''+t+'\')">'+cfg.label+'</button>';
  }).join('');
  document.getElementById('sheetTypePicker').classList.add('visible');
}
function selectEntryType(type){
  document.getElementById('sheetTypePicker').classList.remove('visible');
  if(type==='mood') openMoodSheet();
  else openGenericEntrySheet(type);
}
function closeComposeSheet(){
  ['sheetTypePicker','sheetGeneric','sheetMood','sheetEditTime'].forEach(function(id){
    document.getElementById(id).classList.remove('visible');
  });
}
function nowForDatetimeLocal(){
  var d=new Date();
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function openMoodSheet(){
  _selectedZusammenhang=[];_selectedBeschreibung=[];_tagesreflexion=false;
  document.getElementById('valenzSlider').value=0;
  document.getElementById('valenzValue').textContent='0';
  document.getElementById('zusammenhangTags').innerHTML=tagPickerHtml(ZUSAMMENHANG_TAGS,_selectedZusammenhang,'zusammenhang');
  document.getElementById('beschreibungTags').innerHTML=tagPickerHtml(BESCHREIBUNG_TAGS,_selectedBeschreibung,'beschreibung');
  var tr=document.getElementById('tagesreflexionToggle');tr.textContent='Nein';tr.classList.remove('active');
  document.getElementById('moodBody').value='';
  document.getElementById('moodDatetime').value=nowForDatetimeLocal();
  document.getElementById('sheetMood').classList.add('visible');
}
async function saveMoodEntry(){
  var valenz=parseInt(document.getElementById('valenzSlider').value,10);
  var body=document.getElementById('moodBody').value||'';
  var dtVal=document.getElementById('moodDatetime').value;
  try{
    var r=await fetch('/api/journal/entry',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        entry_type:'mood',
        entry_date:dtVal?new Date(dtVal).toISOString():null,
        body:body,
        tags:['mood'],
        fields:{valenz:valenz,zusammenhang:_selectedZusammenhang,beschreibung:_selectedBeschreibung,tagesreflexion:_tagesreflexion}
      })
    });
    if(!r.ok) throw new Error(r.status);
    closeComposeSheet();
    await loadFeed();
  }catch(e){
    alert('Speichern fehlgeschlagen: '+e.message);
  }
}

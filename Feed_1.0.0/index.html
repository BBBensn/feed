<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed · bensn.me</title>
<meta name="description" content="Persönlicher Journal-Feed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/bensn.css">
<style>
body { overscroll-behavior: none; }

.app-wrap {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.25rem 4rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Filter Bar ── */
.filter-bar {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
  padding: .75rem 0 1rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.filter-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
  cursor: pointer;
  transition: all .15s;
}
.filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
.filter-btn.active { border-color: var(--accent-blue); color: var(--accent-blue); background: rgba(0,166,251,.08); }

/* ── Feed ── */
#feed { display: flex; flex-direction: column; gap: .75rem; }

/* ── Note Card Base ── */
.note-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem 1.5rem;
  transition: border-color .2s;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp .4s ease forwards;
}
.note-card:hover { border-color: var(--border-hover); }

.note-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: .65rem;
}
.note-type-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--muted);
}
.note-date {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
}
.note-title {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -.01em;
  margin-bottom: .4rem;
  color: var(--text);
}
.note-body {
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
}
.note-body-full { display: none; }
.note-card.expanded .note-body-preview { display: none; }
.note-card.expanded .note-body-full { display: block; }

.note-expand {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--accent-blue);
  cursor: pointer;
  margin-top: .5rem;
  display: inline-block;
  background: none;
  border: none;
  padding: 0;
}

/* ── Type-specific accents ── */
.note-card.type-diary   { border-left: 2px solid rgba(255,255,255,.1); }
.note-card.type-mood    { border-left: 2px solid rgba(74,222,128,.3); }
.note-card.type-fits    { border-left: 2px solid rgba(0,166,251,.3); }
.note-card.type-reflexion { border-left: 2px solid rgba(232,114,74,.3); }
.note-card.type-reflexionen { border-left: 2px solid rgba(232,114,74,.3); }
.note-card.type-symptome,
.note-card.type-symptom { border-left: 2px solid rgba(255,0,81,.3); }
.note-card.type-therapie { border-left: 2px solid rgba(255,0,81,.2); }
.note-card.type-project_log,
.note-card.type-projectlog { border-left: 2px solid rgba(0,166,251,.2); }
.note-card.type-idea,
.note-card.type-ideas   { border-left: 2px solid rgba(250,204,21,.3); }
.note-card.type-arbeit  { border-left: 2px solid rgba(255,255,255,.08); }

/* Badge colors per type */
.badge-diary   { border-color: rgba(255,255,255,.12); color: rgba(255,255,255,.4); }
.badge-mood    { border-color: rgba(74,222,128,.3); color: var(--green); }
.badge-fits    { border-color: rgba(0,166,251,.3); color: var(--accent-blue); }
.badge-reflexion, .badge-reflexionen { border-color: rgba(232,114,74,.3); color: var(--orange); }
.badge-symptome, .badge-symptom { border-color: rgba(255,0,81,.3); color: var(--accent-red); }
.badge-therapie { border-color: rgba(255,0,81,.2); color: rgba(255,0,81,.6); }
.badge-project_log, .badge-projectlog { border-color: rgba(0,166,251,.2); color: rgba(0,166,251,.7); }
.badge-idea, .badge-ideas { border-color: rgba(250,204,21,.3); color: rgba(250,204,21,.8); }
.badge-arbeit  { border-color: rgba(255,255,255,.1); color: rgba(255,255,255,.35); }

/* ── Fits Image ── */
.note-image {
  width: 100%;
  max-height: 420px;
  object-fit: cover;
  border-radius: 8px;
  margin-top: .75rem;
  background: rgba(255,255,255,.03);
}

/* ── State ── */
.state-msg {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 3rem 1rem;
  border: 1px dashed var(--border);
  border-radius: 16px;
  line-height: 1.8;
}

/* ── Load More ── */
.load-more {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 20px;
  cursor: pointer;
  margin: 1.5rem auto 0;
  display: block;
  transition: border-color .15s, color .15s;
}
.load-more:hover { border-color: var(--border-hover); color: var(--text); }

footer {
  border-top: 1px solid var(--border);
  padding: 1rem 0;
  display: flex;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 2rem;
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="blobs" id="blobs"></div>

<div class="app-wrap">

  <nav class="app-nav">
    <a href="https://bensn.me" class="nav-crumb"><span>bensn</span>.me</a>
    <span class="nav-sep">/</span>
    <span class="nav-current">feed</span>
    <div class="nav-right">
      <div class="dot" id="statusDot" style="background:var(--muted);animation:none"></div>
      <span id="statusText">laden…</span>
    </div>
  </nav>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-type="">Alle</button>
    <button class="filter-btn" data-type="diary">Diary</button>
    <button class="filter-btn" data-type="mood">Mood</button>
    <button class="filter-btn" data-type="fits">Fits</button>
    <button class="filter-btn" data-type="reflexion">Reflexion</button>
    <button class="filter-btn" data-type="symptome">Symptome</button>
    <button class="filter-btn" data-type="therapie">Therapie</button>
    <button class="filter-btn" data-type="project_log">Projekte</button>
    <button class="filter-btn" data-type="idea">Ideas</button>
    <button class="filter-btn" data-type="arbeit">Arbeit</button>
  </div>

  <div id="feed"></div>

  <footer>
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">feed.bensn.me</span>
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)" id="footer-clock"></span>
  </footer>
</div>

<script src="/shared/bensn.js"></script>
<script>
/* ── Clock ── */
function pad(n){return String(n).padStart(2,'0')}
function clockTick(){
  const n=new Date(), el=document.getElementById('footer-clock');
  if(el) el.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
clockTick(); setInterval(clockTick,1000);

/* ── State ── */
let allNotes=[], activeType='', page=0;
const PAGE_SIZE=20;

/* ── Helpers ── */
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso), now=new Date();
  const diff=Math.floor((now-d)/86400000);
  const time=d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Vienna'});
  const dateStr=d.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',timeZone:'Europe/Vienna'});
  if(diff===0) return 'Heute '+time;
  if(diff===1) return 'Gestern '+time;
  return dateStr+' '+time;
}

function truncate(text, maxLen=300){
  if(!text||text.length<=maxLen) return {short:text,truncated:false};
  return {short:text.slice(0,maxLen).trimEnd()+'…',full:text,truncated:true};
}

function badgeClass(type){
  const t=(type||'').toLowerCase().replace(/\s/g,'_');
  return 'badge-'+t;
}

function typeLabel(type){
  const map={
    diary:'Diary', mood:'Mood', fits:'Fits',
    reflexion:'Reflexion', reflexionen:'Reflexion',
    symptome:'Symptome', symptom:'Symptome',
    therapie:'Therapie', arbeit:'Arbeit',
    project_log:'Projekt', projectlog:'Projekt',
    idea:'Idea', ideas:'Idea'
  };
  return map[(type||'').toLowerCase()]||type||'Note';
}

/* ── Render single note ── */
function renderNote(note, idx){
  const type=(note.type||'').toLowerCase();
  const {short, full, truncated}=truncate(note.content);
  const id='note-'+idx;

  let bodyHtml='';
  if(note.images&&note.images.length>0){
    // Fits: show image
    bodyHtml+=note.images.map(img=>`<img class="note-image" src="${img.url}" alt="${img.alt||''}" loading="lazy" onerror="this.style.display='none'">`).join('');
    if(note.content&&note.content.trim()){
      bodyHtml+=`<div class="note-body" style="margin-top:.75rem">${escHtml(note.content)}</div>`;
    }
  } else if(truncated){
    bodyHtml=`
      <div class="note-body note-body-preview">${escHtml(short)}</div>
      <div class="note-body note-body-full">${escHtml(full)}</div>
      <button class="note-expand" onclick="toggleExpand('${id}',this)">mehr lesen ▾</button>`;
  } else {
    bodyHtml=`<div class="note-body">${escHtml(note.content||'')}</div>`;
  }

  // Title — only show if meaningful
  const titleHtml=note.title&&note.title.length>2&&note.title!==type
    ?`<div class="note-title">${escHtml(note.title)}</div>`:'';

  const el=document.createElement('div');
  el.id=id;
  el.className=`note-card type-${type}`;
  el.style.animationDelay=(idx%PAGE_SIZE*40)+'ms';
  el.innerHTML=`
    <div class="note-meta">
      <span class="note-type-badge ${badgeClass(type)}">${typeLabel(type)}</span>
      <span class="note-date">${fmtDate(note.date)}</span>
    </div>
    ${titleHtml}
    ${bodyHtml}`;
  return el;
}

function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleExpand(id, btn){
  const card=document.getElementById(id);
  card.classList.toggle('expanded');
  btn.textContent=card.classList.contains('expanded')?'weniger ▴':'mehr lesen ▾';
}

/* ── Render feed ── */
function renderFeed(notes, append=false){
  const feed=document.getElementById('feed');
  document.querySelector('.load-more')?.remove();

  if(!append) feed.innerHTML='';

  if(!notes.length&&!append){
    feed.innerHTML='<div class="state-msg">Keine Einträge gefunden.</div>';
    return;
  }

  const start=append?page*PAGE_SIZE:0;
  const slice=notes.slice(start, start+PAGE_SIZE);

  slice.forEach((note,i)=>{
    feed.appendChild(renderNote(note, start+i));
  });

  if(notes.length>start+PAGE_SIZE){
    const btn=document.createElement('button');
    btn.className='load-more';
    btn.textContent='Mehr laden';
    btn.onclick=()=>{page++;renderFeed(notes,true);};
    feed.after(btn);
  }
}

/* ── Filter ── */
document.getElementById('filterBar').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeType=btn.dataset.type;
  page=0;

  const filtered=activeType
    ?allNotes.filter(n=>{
        const t=(n.type||'').toLowerCase();
        // Group reflexion/reflexionen, symptome/symptom, etc.
        if(activeType==='reflexion') return t==='reflexion'||t==='reflexionen';
        if(activeType==='symptome') return t==='symptome'||t==='symptom';
        if(activeType==='project_log') return t==='project_log'||t==='projectlog';
        if(activeType==='idea') return t==='idea'||t==='ideas';
        return t===activeType;
      })
    :allNotes;

  renderFeed(filtered);
});

/* ── Load ── */
async function loadFeed(){
  const dot=document.getElementById('statusDot');
  const statusText=document.getElementById('statusText');
  try{
    const r=await fetch('/api/feed?limit=200');
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    allNotes=data.notes||[];
    dot.style.background='var(--green)';
    dot.style.animation='pulse 2s ease-in-out infinite';
    statusText.textContent=allNotes.length+' einträge';
    page=0;
    renderFeed(allNotes);
  }catch(e){
    dot.style.background='var(--accent-red)';
    dot.style.animation='none';
    statusText.textContent='fehler';
    document.getElementById('feed').innerHTML=
      `<div class="state-msg">Verbindungsfehler<br><span style="font-size:11px;color:var(--accent-red)">${e.message}</span></div>`;
  }
}

loadFeed();
</script>
</body>
</html>
